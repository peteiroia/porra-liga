<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Porra</title>
<meta name="description" content="La Porra: pronostica cada jornada los partidos de Madrid, Barça, Depor y Celta.">
<meta name="theme-color" content="#06140d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" as="image" href="icons/icon-512.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Porra">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06140d; --bg2:#0b2016; --card:rgba(10,28,20,.82); --card2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.10); --text:#eef6f0; --mut:#9db8a7; --dim:#6f8a7a;
  --grass1:#0f3d24; --grass2:#0c3520; --chalk:rgba(255,255,255,.16);
  --gold:#f5c542; --ok:#3ddc84; --sign:#5cb8ff; --zero:#ff6b6b; --warn:#ffb547;
  --accent:#3ddc84; --radius:18px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,sans-serif;font-size:16px}
body{min-height:100vh;min-height:100dvh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:.02em}

/* ---------- Fondo: estadio de noche ---------- */
#stadium{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:
    radial-gradient(60% 40% at 15% -5%,rgba(255,255,230,.18),transparent 70%),
    radial-gradient(60% 40% at 85% -5%,rgba(255,255,230,.18),transparent 70%),
    linear-gradient(#030a07 0%,#06140d 28%,#0a2617 55%,#0c2c1a 100%)}
#stadium .pitch{position:absolute;left:-20%;right:-20%;bottom:-10%;height:70%;
  transform:perspective(700px) rotateX(58deg);transform-origin:50% 100%;
  background:repeating-linear-gradient(90deg,var(--grass1) 0 9%,var(--grass2) 9% 18%);
  box-shadow:0 -40px 80px 40px rgba(6,20,13,.9) inset}
#stadium .pitch::before{content:"";position:absolute;inset:6% 8%;border:3px solid var(--chalk);border-radius:2px}
#stadium .pitch::after{content:"";position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;border:3px solid var(--chalk);border-radius:50%;transform:translate(-50%,-50%)}
#stadium .midline{position:absolute;left:50%;top:6%;bottom:6%;width:3px;background:var(--chalk);transform:translateX(-50%)}
#stadium .lightdots{position:absolute;top:0;left:0;right:0;height:120px;
  background:radial-gradient(circle,rgba(255,255,240,.9) 1.4px,transparent 2px) 0 0/18px 9px;opacity:.25;
  mask:linear-gradient(90deg,#000 0 18%,transparent 18% 82%,#000 82%);-webkit-mask:linear-gradient(90deg,#000 0 18%,transparent 18% 82%,#000 82%)}

/* ---------- Cabecera con banderas ---------- */
header.top{position:sticky;top:0;z-index:20;padding:calc(10px + var(--safe-t)) 16px 10px;
  background:linear-gradient(rgba(3,10,7,.92),rgba(3,10,7,.7));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-family:"Barlow Condensed";font-weight:800;font-size:26px;line-height:1;letter-spacing:.04em;text-transform:uppercase}
.brand h1 span{color:var(--gold)}
.brand small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.me-btn{border:0;background:none;padding:0;display:flex;align-items:center;gap:8px}
.flags-row{display:flex;gap:4px;align-items:flex-end}
.flag-wrap{position:relative;width:34px;height:34px}
.flag-wrap .pole{position:absolute;left:1px;top:0;bottom:0;width:2px;border-radius:2px;background:linear-gradient(#e8e8e8,#888)}
.flag-wrap svg{position:absolute;left:3px;top:1px}

.hero{max-width:760px;margin:16px auto 6px;padding:0 16px}
.hero-flags{display:flex;justify-content:center;gap:clamp(8px,4vw,28px);margin:4px 0 8px}
.hero-flag{position:relative;width:76px;height:86px}
.hero-flag .pole{position:absolute;left:2px;top:0;bottom:0;width:3px;border-radius:3px;background:linear-gradient(#f2f2f2,#7d7d7d)}
.hero-flag .pole::before{content:"";position:absolute;top:-4px;left:-2px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.hero-flag svg{position:absolute;left:5px;top:2px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.hero-flag b{position:absolute;bottom:0;left:0;right:0;text-align:center;font-family:"Barlow Condensed";font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.06em}

main{max-width:760px;margin:0 auto;padding:8px 16px calc(96px + var(--safe-b))}

/* ---------- Tarjetas y controles ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.card+.card{margin-top:12px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;background:var(--card2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:linear-gradient(180deg,#46e690,#22b866);color:#04210f;border:0;box-shadow:0 6px 18px rgba(61,220,132,.3)}
.btn.gold{background:linear-gradient(180deg,#ffd866,#e9ae1b);color:#2a1d00;border:0}
.btn.danger{color:#ff8b8b}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px;font-weight:600}
.input{width:100%;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.28);outline:none;font-size:16px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,220,132,.18)}
.row{display:flex;gap:10px;align-items:center}
.muted{color:var(--mut)} .dim{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.chip.open{color:var(--ok);border-color:rgba(61,220,132,.4);background:rgba(61,220,132,.1)}
.chip.warn{color:var(--warn);border-color:rgba(255,181,71,.4);background:rgba(255,181,71,.1)}
.chip.live{color:#fff;background:#d93636;border-color:#d93636}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.chip.done{color:var(--mut)}
.pts{min-width:34px;justify-content:center}
.pts.p3{background:var(--gold);color:#2a1d00;border-color:var(--gold)}
.pts.p1{background:rgba(92,184,255,.18);color:var(--sign);border-color:rgba(92,184,255,.45)}
.pts.p0{background:rgba(255,107,107,.12);color:var(--zero);border-color:rgba(255,107,107,.35)}
h2.sec{font-family:"Barlow Condensed";font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.05em;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec .chip{font-family:Barlow;letter-spacing:0;text-transform:none}

/* ---------- Avatares ---------- */
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:800;color:#fff;overflow:hidden;
  border:2px solid rgba(255,255,255,.75);box-shadow:0 2px 6px rgba(0,0,0,.35);background:#2b6f4b;font-size:15px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:84px;height:84px;font-size:32px;border-width:3px}
.av.md{width:52px;height:52px;font-size:20px}
.av.sm{width:26px;height:26px;font-size:11px;border-width:1.5px}

/* ---------- Login ---------- */
.auth{max-width:420px;margin:8px auto 0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;border:1px solid var(--line);margin-bottom:6px}
.seg button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
.photo-pick{display:flex;align-items:center;gap:14px;margin:14px 0}
.photo-pick label{flex:1}
.pin{letter-spacing:.5em;font-size:22px;text-align:center;font-weight:700}
.err{color:#ff9a9a;font-size:14px;min-height:20px;margin:6px 2px}

/* ---------- Jornada ---------- */
.jnav{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.jnav .btn{width:44px;height:44px;padding:0;border-radius:50%}
.jnav .jt{flex:1;text-align:center}
.jnav .jt b{display:block;font-family:"Barlow Condensed";font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.jnav .jt small{color:var(--mut);font-size:13px}
.match{position:relative;overflow:hidden;padding:14px 14px 12px}
.match .stripe{position:absolute;left:0;right:0;top:0;height:4px;display:flex}
.match .stripe i{flex:1}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.mhead .when{font-size:13px;color:var(--mut);font-weight:600;text-transform:capitalize}
.mbody{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.team .tn{font-weight:700;font-size:14px;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.team.fav .tn{color:#fff}
.crest{width:50px;height:50px;border-radius:50%;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 12px rgba(0,0,0,.4);display:grid;place-items:center}
.crest span{position:relative;font-family:"Barlow Condensed";font-weight:800;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.45);letter-spacing:.03em}
.score{display:flex;align-items:center;gap:6px}
.score .dash{font-family:"Barlow Condensed";font-size:26px;color:var(--dim);font-weight:700}
.gbox{display:flex;flex-direction:column;align-items:center;gap:4px}
.gbox input{width:54px;height:58px;text-align:center;font-family:"Barlow Condensed";font-weight:800;font-size:34px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.35);outline:none;-moz-appearance:textfield}
.gbox input::-webkit-outer-spin-button,.gbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,220,132,.2)}
.gbox .pm{display:flex;gap:4px}
.gbox .pm button{width:25px;height:24px;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:800;font-size:15px;line-height:1;padding:0}
.bigscore{font-family:"Barlow Condensed";font-weight:800;font-size:44px;line-height:1;padding:0 6px;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.bigscore.pending{color:var(--dim);font-size:30px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.mypick b{font-family:"Barlow Condensed";font-size:18px}
.others{margin-top:10px;display:grid;gap:6px}
.orow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.04)}
.orow .nm{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .pk{font-family:"Barlow Condensed";font-weight:800;font-size:19px;min-width:44px;text-align:center}
.x2btn{margin-top:10px;width:100%;border:1px dashed rgba(255,214,102,.45);background:rgba(255,214,102,.06);color:var(--gold);border-radius:12px;padding:9px;font-weight:700;font-size:14px}
.x2btn.on{border-style:solid;background:linear-gradient(180deg,#ffd866,#e9ae1b);color:#2a1d00;box-shadow:0 0 18px rgba(245,197,66,.35)}
.x2c{color:var(--gold);border-color:rgba(255,214,102,.45)}
.golden{margin:-2px -2px 10px;padding:6px 10px;border-radius:10px;text-align:center;font-size:13px;font-weight:800;letter-spacing:.02em;color:#2a1d00;background:linear-gradient(90deg,#e9ae1b,#ffe07a,#e9ae1b);box-shadow:0 0 16px rgba(245,197,66,.3)}
.res-card{margin-bottom:12px;padding:12px 14px}
.resbar+.resbar{margin-top:10px}
.rb-h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin-bottom:6px}
.rb-h b{font-family:"Barlow Condensed";font-size:20px}
.rb-track{display:flex;gap:4px}
.rb-track i{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.08);transition:background .3s,box-shadow .3s}
.resbar.x2 .rb-track i.on{background:linear-gradient(180deg,#ffe07a,#e9ae1b);box-shadow:0 0 8px rgba(245,197,66,.45)}
.resbar.rt .rb-track i.on{background:linear-gradient(180deg,#ff8a8a,#e23b3b);box-shadow:0 0 8px rgba(226,59,59,.4)}
.resbar.x2 .rb-h b{color:var(--gold)} .resbar.rt .rb-h b{color:#ff7b7b}
.invite{margin-bottom:14px;border-color:rgba(255,214,102,.4);background:linear-gradient(160deg,rgba(255,214,102,.1),var(--card) 60%)}
.code-box{font-family:"Barlow Condensed";font-weight:800;font-size:40px;letter-spacing:.35em;text-align:center;padding:10px 0 10px .35em;border-radius:14px;background:rgba(0,0,0,.35);border:1px dashed rgba(255,214,102,.5);color:var(--gold)}
.fridama{display:flex;align-items:center;gap:12px;margin:14px 2px 4px}
.fridama img{width:52px;height:52px;border-radius:24%;box-shadow:0 0 0 1px rgba(255,214,102,.45),0 6px 16px rgba(0,0,0,.4)}
.fridama b{display:block;font-family:"Barlow Condensed";font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;letter-spacing:.04em;
  background:linear-gradient(180deg,#fff6c8,#ffd65c 45%,#e8a61c 65%,#b0700a);-webkit-background-clip:text;background-clip:text;color:transparent}
.fridama span{font-size:13px;color:var(--mut);font-weight:600}
.grid th,.grid td{white-space:nowrap}
.grid td.who{position:sticky;left:0;background:#0b2016;z-index:1;min-width:120px}
.grid .mcol{font-size:10px;letter-spacing:.02em;text-transform:none;min-width:62px}
.grid .mc{display:flex;justify-content:center;gap:2px;margin-bottom:3px}
.grid .mc .crest{width:16px!important;height:16px!important;border-width:1px!important;box-shadow:none}
.grid .mres{font-family:"Barlow Condensed";font-size:15px;font-weight:800;color:#fff;margin-top:2px}
.grid td.pc{text-align:center;padding:7px 4px}
.grid td.pc small{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.pk2{display:inline-block;min-width:40px;padding:3px 6px;border-radius:8px;font-family:"Barlow Condensed";font-weight:800;font-size:16px;background:rgba(255,255,255,.06)}
.pk2.g3{background:var(--gold);color:#2a1d00}.pk2.g1{background:rgba(92,184,255,.22);color:var(--sign)}.pk2.g0{background:rgba(255,107,107,.15);color:var(--zero)}
.lgd{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.lgd.g3{background:var(--gold)}.lgd.g1{background:rgba(92,184,255,.5)}.lgd.g0{background:rgba(255,107,107,.45)}
.winner{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:10px;border-radius:14px;background:linear-gradient(135deg,rgba(255,214,102,.22),rgba(255,214,102,.05));border:1px solid rgba(255,214,102,.45)}
.winner span{display:block;font-size:12px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.winner b{display:block;font-family:"Barlow Condensed";font-size:24px;line-height:1.05}
.winner small{color:var(--mut);font-weight:600}
.winner .av+.av{margin-left:-18px}
.gen th small{display:block;font-size:9px;letter-spacing:.04em;margin-top:2px}
.gen td{font-weight:700}
/* ---------- Desafío vikingo ---------- */
.duel{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:24px 16px calc(24px + var(--safe-b));
  background:radial-gradient(120% 70% at 50% 45%,#3a1408 0%,#1a0a06 45%,#070405 100%);animation:dIn .5s ease-out both}
@keyframes dIn{from{opacity:0}}
.duel .din.shake{animation:dShake .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes dShake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,3px)}40%,60%{transform:translate(6px,-3px)}}
.duel .din{position:relative;display:flex;flex-direction:column;align-items:center;width:100%}
.duel .storm{position:absolute;inset:-20%;background:
  radial-gradient(40% 25% at 20% 10%,rgba(255,120,40,.18),transparent 70%),radial-gradient(40% 25% at 80% 15%,rgba(255,80,20,.14),transparent 70%),
  repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,140,60,.06) 0 6deg,transparent 6deg 18deg);animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.duel .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,rgba(255,230,180,.95),rgba(255,140,40,.4) 25%,transparent 55%);opacity:0;pointer-events:none}
.duel .flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
.duel .embers i{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#ffb347;box-shadow:0 0 8px 2px rgba(255,140,40,.8);animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-110vh);opacity:0}}
.duel .runes{position:absolute;left:0;right:0;font-family:serif;font-size:22px;letter-spacing:.6em;color:rgba(255,170,90,.28);text-align:center;white-space:nowrap;overflow:hidden}
.duel .runes.t{top:calc(18px + var(--safe-t))}.duel .runes.b{bottom:calc(18px + var(--safe-b))}
.duel .kick{position:relative;font-family:"Barlow Condensed";font-weight:800;letter-spacing:.35em;font-size:13px;color:#ffb36b;text-transform:uppercase;opacity:0;animation:dUp .6s .2s ease-out forwards}
.duel h1{position:relative;z-index:4;margin:4px 0 0;font-family:"Barlow Condensed";font-weight:800;font-size:clamp(38px,11vw,60px);line-height:.92;text-align:center;text-transform:uppercase;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff6d6 0%,#ffd36b 40%,#e0861b 70%,#8a3a07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #2a0d03) drop-shadow(0 0 24px rgba(255,120,30,.55));opacity:0;transform:scale(1.6);animation:slam .5s 1.05s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes slam{to{opacity:1;transform:scale(1)}}
.duel .arena{position:relative;width:min(100%,420px);height:250px;margin:14px 0 0}
.duel .army{position:absolute;top:0;bottom:0;width:56%;overflow:hidden;opacity:0}
.duel .army img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;filter:sepia(.35) saturate(1.25) contrast(1.1) brightness(.92)}
.duel .army::after{content:"";position:absolute;inset:0;mix-blend-mode:multiply}
.duel .army.l::after{background:linear-gradient(180deg,rgba(255,120,90,.55),rgba(170,40,20,.55) 60%,rgba(20,4,4,.95))}
.duel .army.r::after{background:linear-gradient(180deg,rgba(130,170,255,.55),rgba(30,60,140,.55) 60%,rgba(4,6,20,.95))}
.duel .army.l{left:0;width:53%;clip-path:polygon(0 0,100% 0,80% 100%,0 100%);border-radius:14px 0 0 14px;animation:arL .7s .1s cubic-bezier(.2,.9,.3,1) forwards}
.duel .army.r{right:0;width:53%;clip-path:polygon(20% 0,100% 0,100% 100%,0 100%);border-radius:0 14px 14px 0;animation:arR .7s .1s cubic-bezier(.2,.9,.3,1) forwards}
.duel .army.l::before,.duel .army.r::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
@keyframes arL{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes arR{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}

// Cuadrícula: lo que puso cada jugador en cada partido de la jornada
function picksGrid(j, rows) {
  const d = S.data;
  const code = (n) => { const k = kitOf(n); return k ? k.short : initials(n).slice(0, 3); };
  const head = j.matches.map((m) => `<th class="mcol"><div class="mc">${crest(m.home, true)}${crest(m.away, true)}</div><div>${esc(code(m.home))}-${esc(code(m.away))}</div>
    <div class="mres ${m.result ? "" : "dim"}">${m.result ? `${m.result.h}-${m.result.a}` : m.started ? "en juego" : "··"}</div>${m.golden ? `<div style="color:var(--gold)">⭐x2</div>` : ""}</th>`).join("");
  const body = rows.map((r) => {
    const cells = j.matches.map((m) => {
      const isMe = r.name === d.me.name;
      let p = null, pts = null, uni = false;
      if (isMe && m.mine) { p = m.mine; pts = m.myScore ? m.myScore.pts : null; uni = m.myScore && m.myScore.unique; }
      else if (m.others && m.others[r.name]) { const o = m.others[r.name]; p = o; pts = o.pts; uni = o.unique; }
      if (!p) return `<td class="pc">${m.started || isMe ? `<span class="dim">—</span>` : `<span title="Oculto hasta que empiece">🔒</span>`}</td>`;
      const cls = pts == null ? "pend" : pts >= 3 ? "g3" : pts >= 1 ? "g1" : "g0";
      return `<td class="pc"><span class="pk2 ${cls}">${p.h}-${p.a}</span>${pts != null ? `<small>+${pts}${uni ? "🦄" : ""}</small>` : ""}</td>`;
    }).join("");
    return `<tr class="${r.name === d.me.name ? "me" : ""}"><td class="who"><div>${avatar(r.name, r.photo, "sm")}<b>${esc(r.name)}</b></div></td>${cells}<td class="tot">${r.jp}</td></tr>`;
  }).join("");
  return `<h2 class="sec">Resultados de cada jugador</h2><div class="card"><div class="scrollx"><table class="tbl grid"><thead><tr><th>Jugador</th>${head}<th>Pts</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i class="lgd g3"></i>exacto</span><span><i class="lgd g1"></i>signo</span><span><i class="lgd g0"></i>fallo</span><span>🔒 oculto hasta que empiece el partido</span></div></div>`;
}

<body>
<div id="stadium"><div class="lightdots"></div><div class="pitch"><div class="midline"></div></div></div>
<div id="app"><div class="spin"></div></div>

<script>
"use strict";
/* =========================================================
   La Porra · Madrid · Barça · Depor · Celta
   ========================================================= */
const API = "api/porra";
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

/* ---------- Equipos: colores de cada club ---------- */
const CLUBS = {
  madrid: { name: "Real Madrid", short: "RMA", flag: "Madrid", fg: "#1d2a6e", stripes: ["#ffffff"], accent: ["#febe10", "#3e2f8f"], fav: true },
  barca:  { name: "FC Barcelona", short: "FCB", flag: "Barça", fg: "#fff", stripes: ["#a50044", "#004d98", "#a50044", "#004d98", "#a50044"], accent: ["#edbb00"], fav: true },
  depor:  { name: "Deportivo", short: "RCD", flag: "Depor", fg: "#0a3b86", stripes: ["#0068b3", "#ffffff", "#0068b3", "#ffffff", "#0068b3"], accent: [], fav: true },
  celta:  { name: "Celta", short: "CEL", flag: "Celta", fg: "#fff", stripes: ["#8ac6ee"], accent: ["#ffffff", "#e30613"], fav: true },
};
const LIGA = ["Real Madrid", "FC Barcelona", "Deportivo", "Celta", "Atlético de Madrid", "Athletic Club", "Real Sociedad", "Villarreal", "Real Betis", "Sevilla",
  "Valencia", "Osasuna", "Getafe", "Rayo Vallecano", "Girona", "Mallorca", "Espanyol", "Alavés", "Levante", "Elche", "Real Oviedo", "Racing de Santander",
  "Almería", "Las Palmas", "Granada", "Valladolid", "Leganés", "Sporting de Gijón", "Málaga", "Eibar"];
function clubOf(name) {
  const n = String(name || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (/real madrid|^madrid$|r\.? ?madrid/.test(n) && !/atl/.test(n)) return CLUBS.madrid;
  if (/barcelona|barca|^fcb$/.test(n) && !/espanyol/.test(n)) return CLUBS.barca;
  if (/deportivo|depor|coruna/.test(n) && !/alaves/.test(n)) return CLUBS.depor;
  if (/celta/.test(n)) return CLUBS.celta;
  return null;
}
function hashHue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function initials(s) {
  const w = String(s || "?").replace(/^(fc|cd|rcd|ud|sd|ca|real|club)\s+/i, "").split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || "?").slice(0, 3)).toUpperCase();
}
// Colores de cada equipo (camiseta): rayas verticales, banda horizontal o banda diagonal
const KIT = [
  [/real madrid/, "RMA", { st: ["#ffffff"], band: ["#3e2f8f", "#febe10"], fg: "#1d2a6e" }],
  [/barcelona|barca/, "FCB", { st: ["#a50044", "#004d98"], n: 5, fg: "#fff" }],
  [/deportivo|depor|coruna/, "DEP", { st: ["#0068b3", "#ffffff"], n: 5, fg: "#fff" }],
  [/celta/, "CEL", { st: ["#8ac6ee"], band: ["#e30613"], fg: "#fff" }],
  [/atletico/, "ATM", { st: ["#cb3524", "#ffffff"], n: 5, band: ["#272e61"], fg: "#fff" }],
  [/athletic/, "ATH", { st: ["#ee2523", "#ffffff"], n: 5, band: ["#111111"], fg: "#fff" }],
  [/real sociedad/, "RSO", { st: ["#0067b1", "#ffffff"], n: 5, fg: "#fff" }],
  [/villarreal/, "VIL", { st: ["#ffe667"], band: ["#005187"], fg: "#005187" }],
  [/betis/, "BET", { st: ["#0bb363", "#ffffff"], n: 5, fg: "#fff" }],
  [/sevilla/, "SEV", { st: ["#ffffff"], band: ["#d8001e"], fg: "#d8001e" }],
  [/valencia/, "VAL", { st: ["#ffffff"], band: ["#111111", "#ee7203"], fg: "#111" }],
  [/osasuna/, "OSA", { st: ["#d91a21"], band: ["#0a346f"], fg: "#fff" }],
  [/getafe/, "GET", { st: ["#005999"], band: ["#ffffff"], fg: "#fff" }],
  [/rayo/, "RAY", { st: ["#ffffff"], sash: "#e1001a", fg: "#111" }],
  [/girona/, "GIR", { st: ["#d71920", "#ffffff"], n: 5, fg: "#fff" }],
  [/mallorca/, "MLL", { st: ["#e20613"], band: ["#111111"], fg: "#fff" }],
  [/espanyol/, "ESP", { st: ["#007fc8", "#ffffff"], n: 5, fg: "#fff" }],
  [/alaves/, "ALA", { st: ["#0761af", "#ffffff"], n: 5, fg: "#fff" }],
  [/levante/, "LEV", { st: ["#b4053f", "#004f9f"], n: 5, fg: "#fff" }],
  [/elche/, "ELC", { st: ["#ffffff"], band: ["#05642c"], fg: "#05642c" }],
  [/oviedo/, "OVI", { st: ["#0e3a8a"], band: ["#ffffff"], fg: "#fff" }],
  [/racing/, "RAC", { st: ["#ffffff"], band: ["#00915a"], fg: "#00915a" }],
  [/malaga/, "MAL", { st: ["#56a0d3", "#ffffff"], n: 5, fg: "#fff" }],
  [/las palmas/, "LPA", { st: ["#ffe400"], band: ["#0059a6"], fg: "#0059a6" }],
  [/valladolid/, "VLL", { st: ["#5b2b82", "#ffffff"], n: 5, fg: "#fff" }],
  [/leganes/, "LEG", { st: ["#ffffff", "#0b4ea2"], n: 5, fg: "#fff" }],
  [/almeria/, "ALM", { st: ["#e2001a", "#ffffff"], n: 5, fg: "#fff" }],
  [/granada/, "GRA", { st: ["#d71920", "#ffffff"], n: 6, dir: "h", fg: "#fff" }],
  [/sporting/, "SPO", { st: ["#e2001a", "#ffffff"], n: 5, fg: "#fff" }],
  [/eibar/, "EIB", { st: ["#7a1631", "#005ca9"], n: 5, fg: "#fff" }],
  [/cadiz/, "CAD", { st: ["#ffe600"], band: ["#0045a5"], fg: "#0045a5" }],
];
const norm = (n) => String(n || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function kitOf(name) {
  const n = norm(name);
  for (const [re, short, k] of KIT) if (re.test(n) && !(re.source.includes("barcelona") && /espanyol/.test(n)) && !(re.source === "athletic" && /atletico/.test(n))) return { short, ...k };
  return null;
}
function kitBg(k) {
  if (k.st.length === 1) return k.st[0];
  const n = k.n || k.st.length, w = 100 / n, cols = [];
  for (let i = 0; i < n; i++) cols.push(`${k.st[i % k.st.length]} ${(i * w).toFixed(2)}% ${((i + 1) * w).toFixed(2)}%`);
  return `linear-gradient(${k.dir === "h" ? "180deg" : "90deg"},${cols.join(",")})`;
}
function crest(name, small) {
  const k = kitOf(name);
  const size = small ? "width:24px;height:24px;border-width:1.5px;" : "";
  if (!k) {
    const h = hashHue(name);
    return `<div class="crest" style="${size}background:linear-gradient(145deg,hsl(${h} 28% 40%),hsl(${h} 30% 24%))">${small ? "" : `<span style="color:#fff">${esc(initials(name))}</span>`}</div>`;
  }
  let deco = "";
  if (k.band) k.band.forEach((c, i) => (deco += `<i style="position:absolute;left:0;right:0;top:${54 + i * 12}%;height:${k.band.length > 1 ? 10 : 14}%;background:${c}"></i>`));
  if (k.sash) deco += `<i style="position:absolute;left:-20%;top:42%;width:140%;height:18%;background:${k.sash};transform:rotate(-38deg)"></i>`;
  return `<div class="crest" style="${size}background:${kitBg(k)}" title="${esc(name)}">${deco}</div>`;
}
function stripeColors(name) {
  const k = kitOf(name);
  if (!k) return [`hsl(${hashHue(name)} 25% 40%)`];
  return [...new Set([...k.st, ...(k.band || []), ...(k.sash ? [k.sash] : [])])].slice(0, 3);
}

/* ---------- Banderas ondeando (SVG animado) ---------- */
let flagSeq = 0;
function wavePath(W, H, amp, ph) {
  const seg = 8; let top = "", bot = "";
  for (let i = 0; i <= seg; i++) {
    const x = (W * i) / seg, k = i / seg;
    const y = Math.sin(k * Math.PI * 2 + ph) * amp * k;
    top += (i ? " L" : "M") + x.toFixed(1) + " " + y.toFixed(1);
    bot = " L" + x.toFixed(1) + " " + (H + y).toFixed(1) + bot;
  }
  return top + bot + " Z";
}
function flagSVG(club, W, H) {
  const id = "fl" + (++flagSeq), amp = H * 0.09, pad = amp + 1;
  const n = club.stripes.length, sw = W / n;
  let fill = club.stripes.map((s, i) => `<rect x="${i * sw}" y="${-pad}" width="${sw + .5}" height="${H + pad * 2}" fill="${s}"/>`).join("");
  if (club === CLUBS.madrid) fill += `<rect x="0" y="${H * .62}" width="${W}" height="${H * .12}" fill="#3e2f8f"/><rect x="0" y="${H * .76}" width="${W}" height="${H * .08}" fill="#febe10"/>`;
  if (club === CLUBS.celta) fill += `<rect x="0" y="${H * .40}" width="${W}" height="${H * .2}" fill="#ffffff"/><rect x="${W * .12}" y="${H * .14}" width="${W * .1}" height="${H * .72}" fill="#e30613"/><rect x="${W * .02}" y="${H * .44}" width="${W * .3}" height="${H * .12}" fill="#e30613"/>`;
  if (club === CLUBS.barca) fill += `<path d="M0 ${-pad}H${W * .36}V${H * .46}H0Z" fill="#fcdd09"/>` + [1, 3, 5, 7].map((k) => `<rect x="0" y="${(H * .46 * k) / 9}" width="${W * .36}" height="${(H * .46) / 9}" fill="#da121a"/>`).join("");
  const ph = [0, Math.PI * .66, Math.PI * 1.33, Math.PI * 2].map((p) => wavePath(W, H, amp, p));
  const dur = (1.6 + (flagSeq % 4) * .17).toFixed(2) + "s";
  return `<svg width="${W}" height="${H + pad * 2}" viewBox="0 ${-pad} ${W} ${H + pad * 2}" aria-label="Bandera ${club.flag}" role="img">
    <defs><clipPath id="${id}"><path d="${ph[0]}"><animate attributeName="d" dur="${dur}" repeatCount="indefinite" values="${ph.join(";")}"/></path></clipPath>
    <linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".25" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#000" stop-opacity=".2"/><stop offset=".75" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".22"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-.25 0;0 0;-.25 0" dur="${dur}" repeatCount="indefinite"/></linearGradient></defs>
    <g clip-path="url(#${id})">${fill}<rect x="0" y="${-pad}" width="${W}" height="${H + pad * 2}" fill="url(#${id}s)"/></g></svg>`;
}
// Banner de los cracks con focos de estadio
function starsStrip(compact) {
  return `<div class="cracks ${compact ? "compact" : ""}">
    <div class="beams"><i></i><i></i><i></i><i></i></div>
    <picture><source srcset="img/cracks.webp" type="image/webp"><img src="img/cracks.jpg" alt="Iago Aspas, Aubameyang, Mbappé y Lamine Yamal" loading="eager"></picture>
    <div class="glare"></div><div class="flare l"></div><div class="flare r"></div>
    <div class="cracks-cap"><b>Los cracks de La Porra</b><span>Celta · Depor · Madrid · Barça</span></div>
  </div>`;
}
const FOUR = [CLUBS.madrid, CLUBS.barca, CLUBS.depor, CLUBS.celta];
function heroFlags() {
  return `<div class="hero-flags">${FOUR.map((c) => `<div class="hero-flag"><div class="pole"></div>${flagSVG(c, 62, 40)}<b>${c.flag.toUpperCase()}</b></div>`).join("")}</div>`;
}
function miniFlags() {
  return `<div class="flags-row">${FOUR.map((c) => `<div class="flag-wrap"><div class="pole"></div>${flagSVG(c, 26, 17)}</div>`).join("")}</div>`;
}

/* ---------- Avatares ---------- */
function avatar(name, photo, cls = "") {
  if (photo) return `<div class="av ${cls}"><img src="${API}?avatar=${esc(photo)}" alt="" loading="lazy" onerror="this.remove()"></div>`;
  const h = hashHue(name);
  return `<div class="av ${cls}" style="background:linear-gradient(145deg,hsl(${h} 55% 45%),hsl(${(h + 40) % 360} 55% 30%))">${esc(initials(name).slice(0, 2))}</div>`;
}
// Reduce la foto en el propio móvil a 256×256 (recorte cuadrado centrado).
// Admite fotos enormes del iPhone, HEIC y archivos sin tipo.
async function shrinkPhoto(file) {
  if (!file) throw new Error("No se ha elegido ninguna imagen");
  if (file.type && !/^image\//.test(file.type)) throw new Error("Ese archivo no es una imagen");
  const S = 256;
  let src, w, h, cleanup = () => {};
  try {
    if (window.createImageBitmap) {
      src = await createImageBitmap(file);
      w = src.width; h = src.height; cleanup = () => src.close && src.close();
    }
  } catch (e) { src = null; }
  if (!src) {
    const url = URL.createObjectURL(file);
    src = await new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => res(img);
      img.onerror = () => rej(new Error("No se pudo abrir esa imagen. Prueba con otra o haz una captura de pantalla de ella."));
      img.src = url;
    }).finally(() => setTimeout(() => URL.revokeObjectURL(url), 1000));
    w = src.naturalWidth || src.width; h = src.naturalHeight || src.height;
  }
  if (!w || !h) throw new Error("No se pudo leer la imagen");
  // primero a un tamaño intermedio (evita fallos de memoria con fotos de 48 MP en iPhone)
  const m = Math.min(w, h), mid = Math.min(m, 1024);
  const c1 = document.createElement("canvas"); c1.width = c1.height = mid;
  const g1 = c1.getContext("2d");
  g1.fillStyle = "#ffffff"; g1.fillRect(0, 0, mid, mid);
  g1.drawImage(src, (w - m) / 2, (h - m) / 2, m, m, 0, 0, mid, mid);
  cleanup();
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
  g.drawImage(c1, 0, 0, S, S);
  let q = 0.85, d = c.toDataURL("image/jpeg", q);
  while (d.length > 140000 && q > 0.4) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
  if (!/^data:image\/jpeg;base64,/.test(d)) throw new Error("Tu navegador no pudo procesar la imagen");
  return d;
}

/* ---------- Estado y API ---------- */
const INV = (() => { try { const c = new URLSearchParams(location.search).get("codigo"); if (c) ls.set("porra_invite", c.toUpperCase()); return (c || ls.get("porra_invite") || "").toUpperCase(); } catch (e) { return ""; } })();
const S = { inviteCode: INV, token: ls.get("porra_token"), data: null, tab: (location.hash || "#jornada").slice(1), jornada: null, drafts: {}, openOthers: {}, offset: 0, editJ: null, authMode: INV && !ls.get("porra_token") ? "register" : "login", resetEmail: null, newPhoto: null };
const serverNow = () => Date.now() + S.offset;

async function api(action, payload = {}) {
  let r;
  try {
    r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, token: S.token, ...payload }) });
  } catch (e) { throw new Error("Sin conexión. Revisa tu internet."); }
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && action !== "login" && action !== "register") { logoutLocal(); throw new Error(j.error || "Vuelve a entrar"); }
  if (!r.ok) throw new Error(j.error || "Error " + r.status);
  return j;
}
function setData(d) {
  if (!d || !d.jornadas) return;
  S.data = d;
  S.offset = d.now - Date.now();
  if (!S.jornada || !d.jornadas.some((j) => j.id === S.jornada)) {
    const cur = d.jornadas.find((j) => j.current);
    S.jornada = cur ? cur.id : d.jornadas.length ? d.jornadas[d.jornadas.length - 1].id : null;
  }
}
async function refresh(silent) {
  if (!S.token) return render();
  try { setData(await api("state")); }
  catch (e) { if (!silent) toast(e.message, true); }
  render();
  if (S.data && S.data.me && S.data.me.profileDone) setTimeout(checkDuels, 400);
}
function logoutLocal() { S.token = null; S.data = null; ls.set("porra_token", null); render(); }

function toast(msg, isBad) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (isBad ? " bad" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

/* ---------- Fechas ---------- */
const fmtWhen = (iso) => new Date(iso).toLocaleString("es-ES", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function fmtLeft(ms) {
  if (ms <= 0) return "0 min";
  const m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return `${d} d ${h} h`;
  if (h) return `${h} h ${mm} min`;
  return `${Math.max(1, mm)} min`;
}

/* =========================================================
   Pantallas
   ========================================================= */
function render() {
  const app = $("#app");
  if (!S.token) { app.innerHTML = authView(); bindAuth(); return; }
  if (!S.data) { app.innerHTML = `<div class="spin"></div>`; return; }
  const d = S.data;
  if (!d.me.profileDone) { app.innerHTML = profileSetupView(); bindProfileSetup(); return; }
  const tabs = [
    ["jornada", "Pronóstico", '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 3.2 2.9 2.1-1.1 3.4h-3.6L9.1 7.3 12 5.2Zm-6.5 4.6 2.2.7 1.1 3.4-2 2.8-2.2-.1A7.9 7.9 0 0 1 4 12c0-.8.1-1.5.4-2.2h1.1Zm13 0h1.1c.3.7.4 1.4.4 2.2 0 1.6-.5 3.1-1.3 4.4l-2.2.1-2-2.8 1.1-3.4 2.9-.5Zm-8.4 6.7h3.8l1.4 2.6-1.1 1.9a7.9 7.9 0 0 1-4.4 0l-1.1-1.9 1.4-2.6Z" fill="currentColor"/>'],
    ["jtabla", "Jornada", '<path d="M4 4h16v4H4V4Zm0 6h16v10H4V10Zm2 2v2h4v-2H6Zm6 0v2h6v-2h-6Zm-6 4v2h4v-2H6Zm6 0v2h6v-2h-6Z" fill="currentColor"/>'],
    ["tabla", "General", '<path d="M7 4h10v3a5 5 0 0 1-10 0V4Zm-3 1h3v2a3 3 0 0 1-3-2Zm13 0h3a3 3 0 0 1-3 2V5ZM10 13h4v3h3v3H7v-3h3v-3Z" fill="currentColor"/>'],
    ["normas", "Normas", '<path d="M6 3h9l4 4v14H6V3Zm2 6h8v2H8V9Zm0 4h8v2H8v-2Zm0 4h5v2H8v-2Z" fill="currentColor"/>'],
  ];
  if (d.me.admin) tabs.push(["admin", "Admin", '<path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm0 5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm-4 9c.6-1.8 2.2-3 4-3s3.4 1.2 4 3H8Z" fill="currentColor"/>']);
  if (!tabs.some((t) => t[0] === S.tab)) S.tab = "jornada";

  let body = "";
  if (S.tab === "jornada") body = jornadaView();
  else if (S.tab === "tabla") body = tablaView("general");
  else if (S.tab === "jtabla") body = tablaView("jornada");
  else if (S.tab === "normas") body = normasView();
  else if (S.tab === "admin") body = adminView();

  app.innerHTML = `
  <header class="top"><div class="topin">
    <img src="icons/icon-192.png" alt="" style="width:42px;height:42px;flex:none;border-radius:24%;box-shadow:0 0 0 1px rgba(255,226,122,.5)">
    <div class="brand"><h1>La <span>Porra</span></h1><small>Madrid · Barça · Depor · Celta</small></div>
    <button class="me-btn" id="meBtn" aria-label="Mi perfil">${avatar(d.me.name, d.me.photo)}</button>
  </div></header>
  <main>${installBanner()}${body}</main>
  <nav class="tabs"><div class="in">${tabs.map(([k, l, ic]) => `<button data-tab="${k}" class="${S.tab === k ? "on" : ""}"><svg viewBox="0 0 24 24">${ic}</svg>${l}</button>`).join("")}</div></nav>`;
  bindMain();
}

/* ---------- Login / alta / recuperar ---------- */
function authView() {
  const m = S.authMode;
  let form;
  if (m === "register") form = `
    <label class="field"><span>Código de la liga</span><input class="input pin" name="code" maxlength="6" autocapitalize="characters" autocorrect="off" autocomplete="off" placeholder="XXXXXX" value="${esc(S.inviteCode || "")}" style="letter-spacing:.3em;text-transform:uppercase"></label>

function bindAuth() {
  document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => { S.authMode = b.dataset.mode; S.resetEmail = null; render(); }));
  const bf = $("#backForgot"); if (bf) bf.onclick = () => { S.resetEmail = null; render(); };
  $("#authForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target)), btn = e.target.querySelector("button[type=submit]");
    btn.disabled = true; $("#authErr").textContent = "";
    try {
      let r;
      if (S.authMode === "forgot" && !S.resetEmail) {
        await api("forgot", { email: fd.email }); S.resetEmail = fd.email.trim(); render(); return;
      }
      if (S.authMode === "forgot") r = await api("reset", { email: S.resetEmail, code: fd.code, pass: fd.pass });
      else if (S.authMode === "register") r = await api("register", fd);
      else r = await api("login", fd);
      S.token = r.token; ls.set("porra_token", r.token); S.resetEmail = null;
      const wasReg = S.authMode === "register"; S.authMode = "login";
      await refresh();
      if (S.data && S.data.me.profileDone) { toast(`¡Hola, ${S.data.me.name}!`); setTimeout(maybeAskPush, 1500); }
      else if (wasReg && r.admin) toast("Cuenta creada. Eres el administrador de la porra.");
    } catch (err) { $("#authErr").textContent = err.message; btn.disabled = false; }
  };
}

/* ---------- Jornada ---------- */
function curJ() { return S.data.jornadas.find((j) => j.id === S.jornada); }
function liveStatus(m) {
  // El servidor manda el estado; aquí lo afinamos con el reloj para que cierre solo al llegar la hora
  const now = serverNow();
  if (m.result) return "final";
  if (m.kickoff && Date.parse(m.kickoff) <= now) return "live";
  if (m.closesAt && m.closesAt <= now) return "closed";
  if (m.status === "open") return "open";
  if (m.status === "soon" && m.opensAt <= now) return "open";
  return m.status; // soon | next | closed
}
function jornadaView() {
  const d = S.data, js = d.jornadas;
  if (!js.length) return `<div class="card empty"><span class="ball">⚽</span><h2 class="cond" style="margin:4px 0;font-size:24px">Aún no hay jornadas</h2>
    <p class="muted">${d.me.admin ? "Eres el administrador: crea la primera jornada en la pestaña <b>Admin</b>." : "El administrador todavía no ha creado la primera jornada. ¡Vuelve pronto!"}</p>
    ${d.me.admin ? `<button class="btn primary" data-go="admin">Crear jornada</button>` : ""}</div>`;
  const j = curJ(), idx = js.indexOf(j);
  const anyOpen = j.matches.some((m) => liveStatus(m) === "open");
  const drafts = (S.drafts[j.id] = S.drafts[j.id] || {});
  const pending = j.matches.filter((m) => liveStatus(m) === "open" && !m.mine).length;
  let sub = j.title ? esc(j.title) : "";
  const first = j.matches.map((m) => m.kickoff).filter(Boolean).sort()[0];
  if (first) sub = (sub ? sub + " · " : "") + new Date(first).toLocaleDateString("es-ES", { day: "numeric", month: "long" });

  return `
  <div class="jnav">
    <button class="btn" data-j="${idx - 1}" ${idx <= 0 ? "disabled" : ""} aria-label="Jornada anterior">‹</button>
    <div class="jt"><b>${esc(jName(j))}</b><small>${sub}${j.current ? ` · <span style="color:var(--ok);font-weight:700">abierta</span>` : ""}${j.extra ? ` · <span style="color:var(--gold);font-weight:700">jornada extra</span>` : ""}</small></div>
    <button class="btn" data-j="${idx + 1}" ${idx >= js.length - 1 ? "disabled" : ""} aria-label="Jornada siguiente">›</button>
  </div>
  ${myResources(j.matches.reduce((n, m) => { const d = drafts[m.id]; if (!d || liveStatus(m) !== "open") return n; return n + (d.x2 ? 1 : 0) - (m.mine && m.mine.x2 ? 1 : 0); }, 0))}
  ${pending ? `<div class="banner" style="background:rgba(61,220,132,.08);border-color:rgba(61,220,132,.35)"><span style="font-size:24px">✍️</span><div><b>Te ${pending === 1 ? "falta 1 partido" : `faltan ${pending} partidos`} por pronosticar</b><span class="muted">Se cierra cada uno 1 minuto antes de empezar.</span></div></div>` : ""}
  ${retosCard(j)}
  ${j.lastBonus ? `<div class="banner" style="border-color:rgba(255,214,102,.45)"><span style="font-size:26px">⚡</span><div><b>Último de la jornada ${j.num}… ¡pero te llevas un comodín x2 extra!</b><span class="muted">Úsalo en el partido que quieras para remontar.</span></div></div>` : ""}
  ${j.myPleno ? `<div class="banner" style="justify-content:center;text-align:center"><span style="font-size:28px">${j.myPleno === 3 ? "🏆" : "🎉"}</span><div><b>${j.myPleno === 3 ? "¡PLENO DE RESULTADOS!" : "¡Pleno de signos!"} +${j.myPleno}</b><span class="muted">${j.myPleno === 3 ? "Has clavado todos los resultados de la jornada" : "Has acertado el 1X2 de todos los partidos"}</span></div></div>` : ""}
  ${j.matches.map((m) => matchCard(j, m, drafts)).join("")}
  ${jornadaPoints(j)}
  ${anyOpen ? `<div class="savebar"><button class="btn primary" id="saveBtn">Guardar pronósticos</button></div><div style="height:64px"></div>` : ""}`;
}
function matchCard(j, m, drafts) {
  const st = liveStatus(m), now = serverNow();
  const homeC = clubOf(m.home), awayC = clubOf(m.away);
  const stripe = [...stripeColors(m.home), ...stripeColors(m.away)].map((c) => `<i style="background:${c}"></i>`).join("");
  let chip = "";
  if (st === "open") { const left = m.closesAt - now; chip = `<span class="chip ${left < 3 * 3600e3 ? "warn" : "open"}">⏱ Cierra en ${fmtLeft(left)}</span>`; }
  else if (st === "soon") chip = `<span class="chip">🔒 Abre ${new Date(m.opensAt).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" })}</span>`;
  else if (st === "next") chip = `<span class="chip">🔒 Próximamente</span>`;
  else if (st === "tbc") chip = `<span class="chip">🕒 Hora por confirmar</span>`;
  else if (st === "closed") chip = `<span class="chip warn">🔒 Cerrado</span>`;
  else if (st === "live") chip = `<span class="chip live">En juego</span>`;
  else chip = `<span class="chip done">Final</span>`;

  let center;
  if (st === "open") {
    const dv = drafts[m.id] || (m.mine ? { h: m.mine.h, a: m.mine.a, x2: !!m.mine.x2 } : { h: "", a: "", x2: false });
    const g = (side) => `<div class="gbox"><input type="number" inputmode="numeric" min="0" max="30" data-m="${m.id}" data-side="${side}" value="${dv[side]}" aria-label="Goles ${side === "h" ? esc(m.home) : esc(m.away)}" placeholder="–">
      <div class="pm"><button type="button" data-step="-1" data-m="${m.id}" data-side="${side}" aria-label="Menos">−</button><button type="button" data-step="1" data-m="${m.id}" data-side="${side}" aria-label="Más">+</button></div></div>`;
    center = `<div class="score">${g("h")}<span class="dash">:</span>${g("a")}</div>`;
  } else if (m.result) center = `<div class="bigscore cond">${m.result.h}<span style="color:var(--dim)">-</span>${m.result.a}</div>`;
  else center = `<div class="bigscore pending cond">${st === "live" ? "· ·" : "vs"}</div>`;

  let foot = "";
  const mineTxt = m.mine ? `<span class="mypick muted">Tu pronóstico: <b style="color:#fff">${m.mine.h}-${m.mine.a}</b></span>` : `<span class="muted">${st === "open" ? "Sin pronóstico todavía" : "No pronosticaste"}</span>`;
  if (st === "open") {
    const on = drafts[m.id] ? !!drafts[m.id].x2 : !!(m.mine && m.mine.x2);
    foot = `<div class="mfoot">${m.mine ? `<span class="muted">✅ Guardado: <b style="color:#fff">${m.mine.h}-${m.mine.a}</b>${m.mine.x2 ? " ⚡" : ""}</span>` : `<span class="muted">Sin pronóstico todavía</span>`}<span class="lockmsg">👀 ${m.count} de ${S.data.users.length}</span></div>
      ${m.golden ? "" : `<button type="button" class="x2btn ${on ? "on" : ""}" data-x2="${m.id}">⚡ ${on ? "Comodín x2 activado" : "Usar comodín x2"}</button>`}`;
  }
  else if (st === "soon" || st === "next" || st === "tbc") foot = `<div class="mfoot"><span class="lockmsg">${st === "soon" ? "Se podrá pronosticar 7 días antes del partido" : st === "tbc" ? "Se abrirá cuando LaLiga confirme la hora" : "Solo se puede pronosticar la jornada siguiente"}</span></div>`;
  else {
    const sc = m.myScore || (m.result ? { pts: 0, base: 0 } : null);
    const nOthers = Object.keys(m.others || {}).length;
    const open = S.openOthers[m.id];
    foot = `<div class="mfoot">${mineTxt}${m.mine && m.mine.x2 ? ` <span class="chip x2c">⚡ x2</span>` : ""}${sc ? scoreChip(sc.pts, sc.unique) : ""}</div>`;
    if (st === "closed") foot += `<div class="lockmsg" style="margin-top:8px">🙈 Los pronósticos del resto se verán cuando empiece el partido.</div>`;
    else if (nOthers) {
      foot += `<div style="margin-top:8px"><button class="toggle-others" data-others="${m.id}">${open ? "Ocultar" : "Ver"} pronósticos de todos (${nOthers}) ${open ? "▴" : "▾"}</button></div>`;
      if (open) {
        const rows = Object.entries(m.others).sort((a, b) => (b[1].pts ?? 0) - (a[1].pts ?? 0) || a[0].localeCompare(b[0]));
        const ph = Object.fromEntries(S.data.users.map((u) => [u.name, u.photo]));
        foot += `<div class="others">${rows.map(([n, o]) => `<div class="orow">${avatar(n, ph[n], "sm")}<span class="nm">${esc(n)}${n === S.data.me.name ? " (tú)" : ""}</span><span class="pk">${o.h}-${o.a}</span>${o.pts != null ? scoreChip(o.pts, o.unique) : `<span class="chip">…</span>`}</div>`).join("")}</div>`;
      }
    }
  }

  return `<div class="card match"><div class="stripe">${stripe}</div>
    ${m.golden ? `<div class="golden">⭐ ${m.golden} · partido de oro: vale el doble</div>` : ""}
    <div class="mhead"><span class="when">${!m.kickoff ? "Fecha por confirmar" : m.tbc ? "Hacia el " + new Date(m.kickoff).toLocaleDateString("es-ES", { day: "numeric", month: "long" }) : fmtWhen(m.kickoff)}</span>${chip}</div>
    <div class="mbody">
      <div class="team ${homeC ? "fav" : ""}">${crest(m.home)}<span class="tn">${esc(m.home)}</span></div>
      ${center}
      <div class="team ${awayC ? "fav" : ""}">${crest(m.away)}<span class="tn">${esc(m.away)}</span></div>
    </div>${foot}</div>`;
}
// Barra de recursos (comodines / retos) que se va vaciando
function resBar(icon, label, total, used, cls) {
  const left = Math.max(0, total - used);
  return `<div class="resbar ${cls}"><div class="rb-h"><span>${icon} ${label}</span><b>${left}<span class="dim"> / ${total}</span></b></div>
    <div class="rb-track">${Array.from({ length: total }, (_, i) => `<i class="${i < left ? "on" : ""}"></i>`).join("")}</div></div>`;
}
function myResources(extraX2 = 0) {
  const me = S.data.me, c = me.comodines || { total: 3, used: 0 }, r = me.retos || { total: 10, used: 0 };
  return `<div class="card res-card">${resBar("⚡", "Comodines x2", c.total, c.used + extraX2, "x2")}${resBar("⚔️", "Retos", r.total, r.used, "rt")}
    <p class="dim" style="font-size:11px;margin:6px 0 0;text-align:right">🔒 Solo tú ves lo que te queda</p></div>`;
}
const jName = (j) => (j.extra ? `⭐ ${j.title || "Jornada extra"}` : `Jornada ${j.num}`);
const jNameLow = (j) => (j.extra ? (j.title || "jornada extra") : `jornada ${j.num}`);
// ---------- Retos ----------
function retosCard(j) {

  const d = S.data, me = d.me, R = me.retos || { total: 10, max: 2, used: 0, porRival: {} };

  const canRet = j.current && j.retoDeadline && now < j.retoDeadline && !j.matches.some((m) => m.tbc);
  const mine = list.find((r) => r.from === me.name);
  const ph = Object.fromEntries(d.users.map((u) => [u.name, u.photo]));

  }).join("");
  return `<div class="card" style="margin-bottom:12px;border-color:rgba(255,214,102,.3)">
    <b class="cond" style="font-size:19px;text-transform:uppercase;letter-spacing:.04em">⚔️ ${list.some((r) => r.started) ? "Retos de la jornada" : "Tus retos de la jornada"}</b>
    ${rows ? `<div class="others">${rows}</div>` : ""}${action}</div>`;
}
const sign = (h, a) => (h > a ? "1" : h < a ? "2" : "X");
const ptsOf = (p, r) => (p.h === r.h && p.a === r.a ? 3 : sign(p.h, p.a) === sign(r.h, r.a) ? 1 : 0);
// Chip de puntos totales (con comodín, partido de oro y bonus de acierto único ya sumados)
const scoreChip = (pts, unique) => `<span class="chip pts ${pts >= 3 ? "p3" : pts >= 1 ? "p1" : "p0"}">+${pts}${unique ? " 🦄" : pts >= 3 ? " 🎯" : ""}</span>`;
const ptsChip = (p) => `<span class="chip pts p${p}">${p === 3 ? "+3 🎯" : "+" + p}</span>`;
function jornadaPoints(j) {
  if (!j.matches.some((m) => m.result)) return "";
  const rows = S.data.table.map((r) => ({ ...r, jp: r.byJ[j.id] || 0 })).sort((a, b) => b.jp - a.jp || a.name.localeCompare(b.name));
  const fin = j.matches.every((m) => m.result), top = rows.length ? rows[0].jp : 0;

/* ---------- Clasificación ---------- */
function tablaView(mode) {
  const d = S.data, t = d.table;
  if (!t.length) return `<div class="card empty">Todavía no hay jugadores.</div>`;
  const done = d.jornadas.filter((j) => j.matches.some((m) => m.result));
  const doneLiga = done.filter((j) => !j.extra);
  const last = doneLiga[doneLiga.length - 1];
  const podium = t.slice(0, 3);
  const finalJ = d.jornadas.find((j) => !j.extra && j.num === 38);
  const finished = finalJ && finalJ.matches.length && finalJ.matches.every((m) => m.result);
  const pod = (r, g) => r ? `<div class="pod g${g}">${g === 1 ? `<div class="crown">👑</div>` : ""}${avatar(r.name, r.photo, g === 1 ? "lg" : "md")}<div class="nm">${esc(r.name)}</div><div class="pp" style="color:${g === 1 ? "var(--gold)" : "#fff"}">${r.pts} pts</div><div class="step">${g}</div></div>` : `<div></div>`;
  const mv = (r) => {
    if (!r.prevPos) return "";
    const dlt = r.prevPos - r.pos;
    return dlt > 0 ? `<span class="mv up">▲${dlt}</span>` : dlt < 0 ? `<span class="mv down">▼${-dlt}</span>` : `<span class="mv eq">=</span>`;
  };
  // --- Clasificación de la jornada (selector) ---
  const jlist = d.jornadas;
  if (!S.tablaJ || !jlist.some((j) => j.id === S.tablaJ)) {
    // por defecto: la jornada en juego si ya ha empezado; si no, la última con resultados
    const cur = jlist.find((j) => j.current);
    const curStarted = cur && cur.matches.some((m) => m.started || m.result);
    S.tablaJ = (curStarted ? cur : done[done.length - 1] || cur || jlist[0] || {}).id;
  }
  const tj = jlist.find((j) => j.id === S.tablaJ);
  let jornadaBlock = "";

    const ji = jlist.indexOf(tj);
    const finished = tj.matches.every((m) => m.result);
    const started = tj.matches.some((m) => m.result);
    const rowsJ = t.map((r) => ({ ...r, jp: r.byJ[tj.id] || 0 })).sort((a, b) => b.jp - a.jp || a.name.localeCompare(b.name));
    const best = rowsJ.length ? rowsJ[0].jp : 0;

    <div class="card">
      <div class="jnav" style="margin:0 0 10px"><button class="btn" data-tj="${ji - 1}" ${ji <= 0 ? "disabled" : ""} aria-label="Anterior">‹</button>
        <div class="jt"><b style="font-size:22px">${esc(jName(tj))}</b><small>${finished ? "Terminada" : started ? "En curso · puntos provisionales" : tj.current ? "Abierta · aún sin resultados" : "Próximamente"}</small></div>
        <button class="btn" data-tj="${ji + 1}" ${ji >= jlist.length - 1 ? "disabled" : ""} aria-label="Siguiente">›</button></div>
      ${finished && best > 0 ? (() => { const ws = rowsJ.filter((r) => r.jp === best); return `<div class="winner">${ws.map((w) => avatar(w.name, w.photo, "md")).join("")}<div><span>🏆 ${ws.length > 1 ? "Ganadores" : "Ganador"} · ${esc(jNameLow(tj))}</span><b>${ws.map((w) => esc(w.name)).join(" y ")}</b><small>${best} puntos</small></div></div>`; })() : ""}
      <table class="tbl"><thead><tr><th>#</th><th>Jugador</th><th>Pts</th></tr></thead><tbody>
      ${rowsJ.map((r, i) => `<tr class="${r.name === d.me.name ? "me" : ""}"><td class="pos">${i + 1}</td><td class="who"><div>${avatar(r.name, r.photo, "sm")}<b>${esc(r.name)}</b>${started && r.jp === best && best > 0 ? " ⭐" : ""}${r.plenos && r.plenos[tj.id] ? (r.plenos[tj.id] === 3 ? " 🏆" : " 🎉") : ""}${r.retoJ && r.retoJ[tj.id] > 0 ? " ⚔️" : ""}${r.lostJ && r.lostJ[tj.id] ? " 💀" : ""}</div></td><td class="tot">${r.jp}</td></tr>`).join("")}
      </tbody></table>
      <div class="legend"><span>⭐ mejor de la jornada</span><span>🎉🏆 pleno</span><span>⚔️ ganó un reto</span><span>💀 perdió un reto (se queda a 0)</span></div>
    </div>
    ${picksGrid(tj, rowsJ)}
    ${(() => {
      const rl = (d.retos || []).filter((r) => r.jornada === tj.id && r.started);

        const a = r.done ? r.ptsFrom : pj[r.from] || 0, b = r.done ? r.ptsTo : pj[r.to] || 0;
        const lead = a > b ? r.from : b > a ? r.to : null;

        return `<div class="orow" style="flex-wrap:wrap">${avatar(r.from, ph[r.from], "sm")}<span class="nm" style="flex:1">${esc(r.from)}</span><span class="cond" style="font-weight:800;font-size:19px">${a} ⚔️ ${b}</span><span class="nm" style="flex:1;text-align:right">${esc(r.to)}</span>${avatar(r.to, ph[r.to], "sm")}<div style="width:100%;text-align:center;margin-top:4px">${res}</div></div>`;

    })()}`;
  }

  return `
  <h2 class="sec">Clasificación general ${doneLiga.length ? `<span class="chip">tras ${doneLiga.length} jornada${doneLiga.length > 1 ? "s" : ""}</span>` : ""}</h2>
  ${finished ? `<div class="banner" style="justify-content:center;text-align:center"><span style="font-size:30px">🏆</span><div><b style="font-size:18px">¡${esc(t[0].name)}, campeón de La Porra 2026-27!</b><span class="muted">${t[0].pts} puntos tras la jornada 38</span></div></div>`
    : `<p class="dim" style="font-size:13px;margin:-4px 2px 10px">🏆 Gana quien más puntos tenga al acabar la jornada 38 de la Liga 2026-27.</p>`}
  ${(() => { const mx = Math.max(0, ...t.map((r) => r.retoWins || 0)); if (!mx) return ""; const ks = t.filter((r) => (r.retoWins || 0) === mx);
    return `<div class="winner" style="margin-bottom:12px;background:linear-gradient(135deg,rgba(226,59,59,.2),rgba(226,59,59,.04));border-color:rgba(255,123,123,.45)">${ks.map((k) => avatar(k.name, k.photo, "md")).join("")}<div><span style="color:#ff8a8a">⚔️ ${ks.length > 1 ? "Reyes" : "Rey"} de los retos</span><b>${ks.map((k) => esc(k.name)).join(" y ")}</b><small>${mx} reto${mx > 1 ? "s" : ""} ganado${mx > 1 ? "s" : ""}</small></div></div>`; })()}
  ${done.length ? `<div class="card"><div class="podium">${pod(podium[1], 2)}${pod(podium[0], 1)}${pod(podium[2], 3)}</div></div>` : ""}
  <div class="card">
    <table class="tbl gen"><thead><tr><th>#</th><th>Jugador</th><th title="Resultados exactos">🎯<small>Exactos</small></th><th title="Jornadas ganadas">🏆<small>Jornadas</small></th><th title="Retos ganados">⚔️<small>Retos</small></th><th>Pts</th></tr></thead>
    <tbody>${t.map((r) => `<tr class="${r.name === d.me.name ? "me" : ""}"><td class="pos">${r.pos}${mv(r)}</td>
      <td class="who"><div>${avatar(r.name, r.photo, "sm")}<b>${esc(r.name)}</b></div></td>
      <td>${r.exact}</td><td>${r.jWins || 0}</td><td>${r.retoWins || 0}</td><td class="tot">${r.pts}</td></tr>`).join("")}</tbody></table>
    <div class="legend"><span>🎯 resultados exactos</span><span>🏆 veces campeón de jornada</span><span>⚔️ retos ganados</span><span>Los puntos incluyen comodines, bonus y retos · empate a puntos: más exactos</span></div>
  </div>
  ${done.length > 1 ? `<h2 class="sec">Jornada a jornada</h2><div class="card"><div class="scrollx"><table class="tbl matrix"><thead><tr><th>#</th><th>Jugador</th>${done.map((j) => `<th>${j.extra ? "⭐" : "J" + j.num}</th>`).join("")}<th>Total</th></tr></thead>
    <tbody>${t.map((r) => {
      const best = (jid) => Math.max(...t.map((x) => x.byJ[jid] || 0));
      return `<tr class="${r.name === d.me.name ? "me" : ""}"><td class="pos">${r.pos}</td><td class="who"><div>${avatar(r.name, r.photo, "sm")}<b>${esc(r.name)}</b></div></td>${done.map((j) => {

// Cuadrícula: lo que puso cada jugador en cada partido de la jornada
function picksGrid(j, rows) {
  const d = S.data;
  const code = (n) => { const k = kitOf(n); return k ? k.short : initials(n).slice(0, 3); };
  const head = j.matches.map((m) => `<th class="mcol"><div class="mc">${crest(m.home, true)}${crest(m.away, true)}</div><div>${esc(code(m.home))}-${esc(code(m.away))}</div>
    <div class="mres ${m.result ? "" : "dim"}">${m.result ? `${m.result.h}-${m.result.a}` : m.started ? "en juego" : "··"}</div>${m.golden ? `<div style="color:var(--gold)">⭐x2</div>` : ""}</th>`).join("");
  const body = rows.map((r) => {
    const cells = j.matches.map((m) => {
      const isMe = r.name === d.me.name;
      let p = null, pts = null, uni = false;
      if (isMe && m.mine) { p = m.mine; pts = m.myScore ? m.myScore.pts : null; uni = m.myScore && m.myScore.unique; }
      else if (m.others && m.others[r.name]) { const o = m.others[r.name]; p = o; pts = o.pts; uni = o.unique; }
      if (!p) return `<td class="pc">${m.started || isMe ? `<span class="dim">—</span>` : `<span title="Oculto hasta que empiece">🔒</span>`}</td>`;
      const cls = pts == null ? "pend" : pts >= 3 ? "g3" : pts >= 1 ? "g1" : "g0";
      return `<td class="pc"><span class="pk2 ${cls}">${p.h}-${p.a}</span>${pts != null ? `<small>+${pts}${uni ? "🦄" : ""}</small>` : ""}</td>`;
    }).join("");
    return `<tr class="${r.name === d.me.name ? "me" : ""}"><td class="who"><div>${avatar(r.name, r.photo, "sm")}<b>${esc(r.name)}</b></div></td>${cells}<td class="tot">${r.jp}</td></tr>`;
  }).join("");
  return `<h2 class="sec">Resultados de cada jugador</h2><div class="card"><div class="scrollx"><table class="tbl grid"><thead><tr><th>Jugador</th>${head}<th>Pts</th></tr></thead><tbody>${body}</tbody></table></div>
    <div class="legend"><span><i class="lgd g3"></i>exacto</span><span><i class="lgd g1"></i>signo</span><span><i class="lgd g0"></i>fallo</span><span>🔒 oculto hasta que empiece el partido</span></div></div>`;
}

function showHeist(r) {
  if (document.querySelector(".heist") || document.querySelector(".duel")) return;
  const me = S.data.me.name, win = r.winner === me, rival = win ? r.loser : r.winner, n = r.gain || 0;

    <div class="big"><span class="cnt">${win ? "+" : "−"}0</span><small>pts</small></div>

    <button class="btn-heist">${win ? "💰 ¡A por más!" : "😤 Me vengaré"}</button>`;
  document.body.appendChild(el);
  // contador que sube hasta el número robado
  const cnt = el.querySelector(".cnt"), sign = win ? "+" : "−";
  setTimeout(() => {
    const t0 = performance.now(), dur = 900;
    const step = (t) => { const k = Math.min(1, (t - t0) / dur); cnt.textContent = sign + Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    if (navigator.vibrate) navigator.vibrate(win ? [40, 30, 40, 30, 120] : [200]);

function checkDuels() {
  if (!S.data || !S.data.me) return;
  let seen = [];
  try { seen = JSON.parse(ls.get("porra_duels") || "[]"); } catch (e) {}
  const me = S.data.me.name;
  const fin = (S.data.retos || []).find((r) => r.done && r.winner && (r.winner === me || r.loser === me) && !seen.includes("res:" + r.id));
  if (fin) { seen.push("res:" + fin.id); ls.set("porra_duels", JSON.stringify(seen.slice(-80))); showHeist(fin); return; }
  const nuevo = (S.data.retos || []).find((r) => r.to === me && !r.done && !seen.includes(r.id));
  if (!nuevo) return;
  seen.push(nuevo.id); ls.set("porra_duels", JSON.stringify(seen.slice(-80)));
  showDuel(nuevo);
}

/* ---------- Avisos push ---------- */
function b64ToU8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
async function enablePush(test) {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      if (isIOS()) installHelp(); else toast("Este navegador no admite avisos", true);
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Has bloqueado los avisos. Actívalos en los ajustes del móvil.", true); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { publicKey } = await api("vapid");
      if (!publicKey) { toast("Los avisos aún no están disponibles en el servidor", true); return; }
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
    }
    await api("subscribe", { sub: sub.toJSON() });
    ls.set("porra_push", "1");
    if (test) { const r = await api("testPush"); toast(r.sent ? "¡Avisos activados! Te ha llegado uno de prueba." : "Avisos activados."); }
    else toast("¡Avisos activados!");
  } catch (e) { toast("No se pudieron activar los avisos: " + e.message, true); }
}
function maybeAskPush() {
  if (!S.data || ls.get("porra_push") === "1" || ls.get("porra_push_asked") === "1") return;
  if (!("PushManager" in window) || typeof Notification === "undefined" || Notification.permission !== "default") return;
  ls.set("porra_push_asked", "1");
  openSheet(`<div style="text-align:center"><div style="font-size:46px">🔔</div><h2 class="cond" style="margin:6px 0;font-size:26px">¿Te avisamos?</h2>
    <p class="muted">Si a 1 hora de un partido no has puesto tu resultado, te llega una notificación al móvil.</p></div>
    <button class="btn primary block" id="pushYes">Sí, avisadme</button><button class="btn block" style="margin-top:8px" data-close>Ahora no</button>`,
  (el, close) => { $("#pushYes", el).onclick = () => { close(); enablePush(true); }; $("[data-close]", el).onclick = close; });
}

/* ---------- Eventos ---------- */
function bindMain() {
  document.querySelectorAll("[data-tab]").forEach((b) => (b.onclick = () => { S.tab = b.dataset.tab; history.replaceState(null, "", "#" + S.tab); render(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => { S.tab = b.dataset.go; render(); }));
  $("#meBtn").onclick = profileSheet;
  const ib = $("#instBtn"); if (ib) ib.onclick = installHelp;
  const ix = $("#instX"); if (ix) ix.onclick = () => { ls.set("porra_nobanner", "1"); render(); };

  // Jornada
  document.querySelectorAll("[data-j]").forEach((b) => (b.onclick = () => { const j = S.data.jornadas[+b.dataset.j]; if (j) { S.jornada = j.id; render(); } }));
  document.querySelectorAll("[data-tj]").forEach((b) => (b.onclick = () => {
    const jl = S.data.jornadas;
    const x = jl[+b.dataset.tj]; if (x) { S.tablaJ = x.id; render(); }
  }));
  document.querySelectorAll("[data-others]").forEach((b) => (b.onclick = () => { S.openOthers[b.dataset.others] = !S.openOthers[b.dataset.others]; render(); }));
  const j = S.data.jornadas.length ? curJ() : null;
  const dr = j ? (S.drafts[j.id] = S.drafts[j.id] || {}) : null;
  const getDraft = (mid) => {
    if (!dr[mid]) { const m = j.matches.find((x) => x.id === mid); dr[mid] = m && m.mine ? { h: m.mine.h, a: m.mine.a, x2: !!m.mine.x2 } : { h: "", a: "", x2: false }; }
    return dr[mid];
  };
  document.querySelectorAll(".gbox input").forEach((inp) => (inp.oninput = () => {
    let v = inp.value.replace(/\D/g, "").slice(0, 2);
    if (v !== "" && +v > 30) v = "30";
    inp.value = v; getDraft(inp.dataset.m)[inp.dataset.side] = v === "" ? "" : +v;
  }));
  document.querySelectorAll("[data-step]").forEach((b) => (b.onclick = () => {
    const d = getDraft(b.dataset.m), s = b.dataset.side;
    const v = Math.max(0, Math.min(30, (d[s] === "" ? (b.dataset.step > 0 ? -1 : 1) : d[s]) + +b.dataset.step));
    d[s] = v; const inp = document.querySelector(`.gbox input[data-m="${b.dataset.m}"][data-side="${s}"]`); if (inp) inp.value = v;
    if (navigator.vibrate) navigator.vibrate(8);
  }));
  document.querySelectorAll("[data-x2]").forEach((b) => (b.onclick = () => {
    const d = getDraft(b.dataset.x2);
    if (!d.x2) {
      const c = S.data.me.comodines || { total: 3, used: 0 };
      const used = c.used + j.matches.reduce((n, m) => { const x = dr[m.id]; if (!x || liveStatus(m) !== "open") return n; return n + (x.x2 ? 1 : 0) - (m.mine && m.mine.x2 ? 1 : 0); }, 0);
      if (used >= c.total) { toast(`Ya has usado tus ${c.total} comodines de la temporada`, true); return; }
    }
    d.x2 = !d.x2; render();
    if (navigator.vibrate) navigator.vibrate(15);
  }));
  const rg = $("#retoGo");
  if (rg) rg.onclick = async () => {
    const to = $("#retoTo").value;
    if (!confirm(`¿Retar a ${to} en la jornada ${j.num}? Te quedará un reto menos.`)) return;
    rg.disabled = true;
    try { setData(await api("reto", { jornada: j.id, to })); render(); toast(`⚔️ Has retado a ${to}`); } catch (err) { toast(err.message, true); rg.disabled = false; }
  };
  const rc = $("#retoCancel");
  if (rc) rc.onclick = async () => {
    try { setData(await api("cancelReto", { jornada: j.id })); render(); toast("Reto quitado"); } catch (err) { toast(err.message, true); }
  };
  const sb = $("#saveBtn");
  if (sb) sb.onclick = async () => {
    const picks = {};
    for (const m of j.matches) {
      if (liveStatus(m) !== "open") continue;
      const d = dr[m.id];
      if (!d) continue;
      if ((d.h === "") !== (d.a === "")) { toast(`Completa los dos marcadores de ${m.home} – ${m.away}`, true); return; }
      if (d.h !== "") picks[m.id] = { h: d.h, a: d.a, x2: !!d.x2 };
      else if (d.x2) { toast(`Pon el resultado de ${m.home} – ${m.away} para usar el comodín`, true); return; }
    }
    if (!Object.keys(picks).length) { toast("Pon al menos un resultado", true); return; }
    sb.disabled = true; sb.textContent = "Guardando…";
    try {
      const r = await api("predict", { jornada: j.id, picks });
      S.drafts[j.id] = {}; setData(r); render();
      toast(r.skipped ? `Guardados ${r.saved}. ${r.skipped} ya estaban cerrados.` : `✅ ¡Pronósticos guardados! (${r.saved})`, !!r.skipped && !r.saved);
      if (!r.skipped) setTimeout(maybeAskPush, 900);
    } catch (e) { toast(e.message, true); sb.disabled = false; sb.textContent = "Guardar pronósticos"; }
  };

  // Admin
  const nj = $("#newJ");
  if (nj) nj.onclick = () => {
    const nums = S.data.jornadas.map((x) => x.num);
    S.editJ = { id: null, num: nums.length ? Math.max(...nums.filter((n) => n < 1000), 0) + 1 : 1, title: "", matches: [] };
    render(); window.scrollTo(0, 0);
  };
  const nx = $("#newX");
  if (nx) nx.onclick = () => { S.editJ = { id: null, extra: true, num: 0, title: "", matches: [{ home: "", away: "", kickoff: "" }] }; render(); window.scrollTo(0, 0); };
  document.querySelectorAll("[data-editj]").forEach((b) => (b.onclick = () => {
    const x = S.data.jornadas.find((q) => q.id === b.dataset.editj);
    S.editJ = { id: x.id, extra: !!x.extra, num: x.num, title: x.title, matches: x.matches.map((m) => ({ id: m.id, home: m.home, away: m.away, kickoff: m.kickoff, result: m.result })) };
    render(); window.scrollTo(0, 0);
  }));
  document.querySelectorAll("[data-addm]").forEach((b) => (b.onclick = () => {
    collectEdit(); S.editJ.matches.push({ home: b.dataset.addm, away: "", kickoff: "" }); render();
    const rows = document.querySelectorAll("#ejMatches .mrow"); const last = rows[rows.length - 1];
    if (last) last.querySelector(b.dataset.addm ? '[data-f="away"]' : '[data-f="home"]').focus();
  }));
  document.querySelectorAll("[data-delm]").forEach((b) => (b.onclick = () => { collectEdit(); S.editJ.matches.splice(+b.dataset.delm, 1); render(); }));
  document.querySelectorAll("[data-swap]").forEach((b) => (b.onclick = () => { collectEdit(); const m = S.editJ.matches[+b.dataset.swap]; [m.home, m.away] = [m.away, m.home]; render(); }));
  // Invitación
  if ($("#leagueCode")) {
    const loadCode = async (regen) => { try { const r = await api("code", { regen }); S.leagueCode = r.code; const el = $("#leagueCode"); if (el) el.textContent = r.code; } catch (err) { toast(err.message, true); } };
    if (!S.leagueCode) loadCode(false);
    $("#invShare").onclick = async () => {
      if (!S.leagueCode) await loadCode(false);
      const text = inviteText(S.leagueCode);
      if (navigator.share) { try { await navigator.share({ title: "La Porra", text }); return; } catch (e) { if (e.name === "AbortError") return; } }
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };
    $("#invCopy").onclick = async () => {
      if (!S.leagueCode) await loadCode(false);
      try { await navigator.clipboard.writeText(inviteText(S.leagueCode)); toast("Mensaje copiado. Pégalo en WhatsApp"); }
      catch (e) { prompt("Copia este mensaje:", inviteText(S.leagueCode)); }
    };
    $("#invRegen").onclick = async () => {
      if (!confirm("¿Cambiar el código? El anterior dejará de servir para nuevas altas (los que ya juegan no se ven afectados).")) return;
      await loadCode(true); toast("Código nuevo: " + S.leagueCode);
    };
  }
  const sc = $("#syncCal");
  if (sc) sc.onclick = async () => {
    sc.disabled = true;
    try { setData(await api("syncCalendar")); render(); toast("Calendario actualizado"); } catch (err) { toast(err.message, true); sc.disabled = false; }
  };
  const ec = $("#ejCancel"); if (ec) ec.onclick = () => { S.editJ = null; render(); };
  const es = $("#ejSave");
  if (es) es.onclick = async () => {
    collectEdit(); es.disabled = true;
    try {
      const e = S.editJ;
      setData(await api("saveJornada", { id: e.id, extra: !!e.extra, num: +e.num, title: e.title, matches: e.matches }));
      S.editJ = null; render(); toast("Jornada guardada");
    } catch (err) { toast(err.message, true); es.disabled = false; }
  };
  const ed = $("#ejDel");
  if (ed) ed.onclick = async () => {
    if (!confirm("¿Borrar esta jornada y sus pronósticos? No se puede deshacer.")) return;
    try { setData(await api("deleteJornada", { id: S.editJ.id })); S.editJ = null; S.jornada = null; setData(S.data); render(); toast("Jornada borrada"); }
    catch (err) { toast(err.message, true); }
  };
  document.querySelectorAll("[data-res]").forEach((b) => (b.onclick = async () => {
    const [jid, mid] = b.dataset.res.split("|");
    const h = $("#rh-" + mid).value, a = $("#ra-" + mid).value;
    try {
      if (h === "" && a === "") setData(await api("setResult", { jornada: jid, match: mid, clear: true }));
      else setData(await api("setResult", { jornada: jid, match: mid, h: +h, a: +a }));
      render(); toast("Resultado guardado · clasificación actualizada");
    } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-uadm]").forEach((b) => (b.onclick = async () => {
    const [n, v] = b.dataset.uadm.split("|");
    try { setData(await api("setAdmin", { name: n, admin: v === "1" })); render(); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-upin]").forEach((b) => (b.onclick = async () => {
    const pass = prompt(`Nueva contraseña para ${b.dataset.upin} (mínimo 6). Pásasela y que la cambie desde su perfil:`);
    if (!pass) return;
    try { await api("resetPass", { name: b.dataset.upin, pass }); toast(`Contraseña de ${b.dataset.upin} cambiada a: ${pass}`); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-udel]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`¿Eliminar a ${b.dataset.udel} y todos sus pronósticos?`)) return;
    try { setData(await api("deleteUser", { name: b.dataset.udel })); render(); toast("Jugador eliminado"); } catch (err) { toast(err.message, true); }
  }));
}

/* ---------- Arranque ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== S.tab) { S.tab = t; render(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
// Cada 30 s: refresca contadores; si un partido acaba de cerrar o empezar, vuelve a pedir datos
let lastSig = "";
setInterval(() => {
  if (!S.data || S.tab !== "jornada" || S.editJ) return;
  const j = curJ(); if (!j) return;
  const sig = j.matches.map(liveStatus).join();
  if (lastSig && sig !== lastSig) refresh(true);
  else if (!document.activeElement || !document.activeElement.matches("input")) render();
  lastSig = sig;
}, 30000);
setInterval(() => { if (!document.hidden && S.token) refresh(true); }, 5 * 60000);
refresh();
</script>
</body>
</html>
