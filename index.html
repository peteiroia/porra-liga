// Confeti con cañones laterales («¡Chum! ¡Chum!»)
function confetti(canvas) {
  const ctx = canvas.getContext("2d"), dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = (canvas.width = innerWidth * dpr), H = (canvas.height = innerHeight * dpr);
  const cols = ["#ffd36b", "#ff5a5a", "#5cb8ff", "#3ddc84", "#ffffff", "#c86bff", "#ff9a2e"];
  let parts = [];
  const shoot = (fromLeft) => {
    for (let i = 0; i < 140; i++) {
      const ang = (fromLeft ? -60 : -120) + (Math.random() * 40 - 20), sp = (14 + Math.random() * 16) * dpr;
      parts.push({ x: fromLeft ? 0 : W, y: H * 0.78, vx: Math.cos(ang * Math.PI / 180) * sp, vy: Math.sin(ang * Math.PI / 180) * sp,
        w: (6 + Math.random() * 7) * dpr, h: (8 + Math.random() * 10) * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[(Math.random() * cols.length) | 0], life: 0 });
    }
  };
  const rain = () => { for (let i = 0; i < 60; i++) parts.push({ x: Math.random() * W, y: -20 * dpr, vx: (Math.random() - .5) * 2 * dpr, vy: (2 + Math.random() * 3) * dpr, w: 7 * dpr, h: 11 * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0], life: 0 }); };
  let alive = true;
  const tick = () => {
    if (!alive || !canvas.isConnected) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      if (p.spark) {
        p.vx *= 0.96; p.vy = p.vy * 0.96 + 0.08 * dpr; p.x += p.vx; p.y += p.vy; p.life++;
        if (p.life > 60) { p.y = H + 999; continue; }
        ctx.globalAlpha = Math.max(0, 1 - p.life / 60); ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8 * dpr;
        ctx.beginPath(); ctx.arc(p.x, p.y, 2.2 * dpr, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.shadowBlur = 0; continue;
      }
      p.vy += 0.35 * dpr; p.vx *= 0.985; p.vy = Math.min(p.vy, 7 * dpr); p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.scale(1, Math.cos(p.life * 0.15));
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    parts = parts.filter((p) => p.y < H + 40 * dpr);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  const firework = (x, y) => {
    const c = cols[(Math.random() * cols.length) | 0], n = 70;
    for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2, sp = (4 + Math.random() * 4) * dpr;
      parts.push({ x: x * W, y: y * H, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: 4 * dpr, h: 4 * dpr, r: 0, vr: 0, c, life: 0, spark: true }); }
  };
  return { shoot, rain, firework, stop: () => (alive = false) };
}

function stadium() {
  let ac; try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return { cheer() {}, horn() {}, stop() {} }; }
  const master = ac.createGain(); master.gain.value = 0.0; master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(0.22, ac.currentTime + 1.2);
  const len = ac.sampleRate * 2, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1; }
  const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 900; bp.Q.value = 0.6;
  const lfo = ac.createOscillator(), lfoG = ac.createGain(); lfo.frequency.value = 0.35; lfoG.gain.value = 300; lfo.connect(lfoG); lfoG.connect(bp.frequency);
  const crowdG = ac.createGain(); crowdG.gain.value = 0.55;
  noise.connect(bp); bp.connect(crowdG); crowdG.connect(master); noise.start(); lfo.start();
  return {
    cheer() { const t = ac.currentTime; crowdG.gain.cancelScheduledValues(t); crowdG.gain.setValueAtTime(crowdG.gain.value, t); crowdG.gain.linearRampToValueAtTime(1.4, t + .4); crowdG.gain.linearRampToValueAtTime(.6, t + 2.6); },
    horn() {
      const t = ac.currentTime, g = ac.createGain(); g.connect(master); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .05); g.gain.setValueAtTime(.9, t + 1.1); g.gain.linearRampToValueAtTime(0, t + 1.4);
      [233, 294, 349].forEach((f) => { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1800; o.connect(lp); lp.connect(g); o.start(t); o.stop(t + 1.45); });
      this.cheer();
    },
    stop() { try { const t = ac.currentTime; master.gain.linearRampToValueAtTime(0, t + .6); setTimeout(() => ac.close(), 800); } catch (e) {} },
  };
}
// Pantalla de llamada entrante: suena el tono y, al contestar, una voz dice el mensaje
function showCall(c) {
  if (document.querySelector(".call")) return;
  const el = document.createElement("div");
  el.className = "call";
  el.innerHTML = `<div class="who"><small>Llamada entrante…</small><b>La Porra</b><div class="ava"><i></i><i></i><i></i><img src="icons/icon-192.png" alt=""></div></div>

    <div class="btns"><button class="cb no"><span>📵</span>Rechazar</button><button class="cb si"><span>📞</span>Contestar</button></div>`;
  document.body.appendChild(el);
  let ac = null, ringT = null;
  const ring = () => { // tono curioso: silbato de árbitro + «oé, oé, oé» en marimba
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const t0 = ac.currentTime + .05, out = ac.createGain(); out.gain.value = .5; out.connect(ac.destination);
      // silbato: tono agudo con vibrato rápido, dos pitidos (corto + largo)
      [[0, .18], [.28, .55]].forEach(([st, du]) => {
        const o = ac.createOscillator(), g = ac.createGain(), vib = ac.createOscillator(), vg = ac.createGain();
        o.type = "sine"; o.frequency.value = 2900; vib.frequency.value = 38; vg.gain.value = 120; vib.connect(vg); vg.connect(o.frequency);
        g.gain.setValueAtTime(0, t0 + st); g.gain.linearRampToValueAtTime(.35, t0 + st + .02); g.gain.setValueAtTime(.35, t0 + st + du - .03); g.gain.linearRampToValueAtTime(0, t0 + st + du);
        o.connect(g); g.connect(out); o.start(t0 + st); vib.start(t0 + st); o.stop(t0 + st + du + .02); vib.stop(t0 + st + du + .02);
      });
      // «oé, oé, oé, oé» (mi-do mi-do mi-do re-mi) en marimba
      const notes = [[659, 0], [523, .22], [659, .52], [523, .74], [659, 1.04], [523, 1.26], [587, 1.56], [659, 1.78]];
      notes.forEach(([f, st]) => {
        const t = t0 + .95 + st, o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f; o2.type = "sine"; o2.frequency.value = f * 4; 
        const g2 = ac.createGain(); g2.gain.value = .25; o2.connect(g2); g2.connect(g);
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + .008); g.gain.exponentialRampToValueAtTime(.001, t + .34);
        o.connect(g); g.connect(out); o.start(t); o2.start(t); o.stop(t + .36); o2.stop(t + .36);
      });
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate([150, 80, 400, 200, 120, 60, 120, 60, 120]);
  };
  // si el móvil bloquea el sonido hasta tocar la pantalla, suena en el primer toque
  el.addEventListener("pointerdown", () => { try { if (ac && ac.state === "suspended") { ac.resume(); } } catch (e) {} }, { once: true });
  ring(); ringT = setInterval(ring, 3600);
  let ended = false;
  const end = () => { if (ended) return; ended = true; clearInterval(ringT); try { speechSynthesis.cancel(); } catch (e) {} el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => { el.remove(); showAfterCall(); }, 300); };
  el.querySelector(".no").onclick = end;
  el.querySelector(".si").onclick = () => {
    clearInterval(ringT); if (navigator.vibrate) navigator.vibrate(0);
    el.querySelector(".who small").innerHTML = '<span class="timer">00:00</span>';
    el.querySelector(".si").remove(); el.querySelector(".no").lastChild.textContent = "Colgar";
    const t0 = Date.now(), tm = setInterval(() => { const s2 = Math.floor((Date.now() - t0) / 1000); const sp = el.querySelector(".timer"); if (sp) sp.textContent = `00:${String(s2).padStart(2, "0")}`; else clearInterval(tm); }, 500);
    // Guion de locutor de carrusel: primero el cachondeo de pronósticos, luego el mensaje (la tortilla)
    const guion = [
      { t: "¡Buenas noches, porreros y porreras! Conectamos en directo con el carrusel de La Porra.", r: 1.12, p: 1.0 },
      { t: "Atención, que hay movimiento en la clasificación: alguien ha puesto un cinco a cero al Depor… ¡por amor al escudo!", r: 1.16, p: 1.08 },
      { t: "Y otro ha gastado el comodín en un empate a cero. ¡Valiente, valiente, valiente!", r: 1.18, p: 1.12 },
      { t: "Recuerden: el que no pronostica, no puntúa… y el que no puntúa… ¡pela patatas!", r: 1.1, p: 1.0 },
      ...String(c.text).split(/(?<=[.!?])\s+/).filter(Boolean).map((t, i) => ({ t, r: 1.05 + i * .05, p: 1.15 + i * .05, big: true })),
    ];
    const crowd = stadium(); let i = 0;
    const msg = el.querySelector(".msg");
    const voices = (() => { try { return speechSynthesis.getVoices(); } catch (e) { return []; } })();
    const voice = voices.find((x) => /^es(-|_)ES/i.test(x.lang) && /male|hombre|jorge|pablo|diego|alvaro|enrique/i.test(x.name)) || voices.find((x) => /^es(-|_)ES/i.test(x.lang)) || voices.find((x) => /^es/i.test(x.lang));
    const next = () => {
      if (!el.isConnected) return;
      if (i >= guion.length) { crowd.horn(); setTimeout(() => { crowd.stop(); end(); }, 1600); return; }
      const g = guion[i++];
      msg.style.fontSize = g.big ? "34px" : "24px"; msg.textContent = g.t;
      if (g.big) crowd.cheer();
      try {
        const u = new SpeechSynthesisUtterance(g.t); u.lang = "es-ES"; u.rate = 1; u.pitch = 1; u.volume = 1;   // voz normal
        if (voice) u.voice = voice;
        u.onend = () => setTimeout(next, 180); u.onerror = () => setTimeout(next, 1500);
        speechSynthesis.speak(u);
      } catch (e) { setTimeout(next, 2600); }
    };
    next();
    setTimeout(() => { if (el.isConnected) { crowd.stop(); end(); } }, 45000);
  };
}

function checkDuels() {
  if (!S.data || !S.data.me) return;
  // llamada: sale en las 5 primeras aperturas de la app (una vez por apertura)
  { const c = S.data.llamada;
    if (c && !S.callShown && !document.querySelector(".duel,.heist,.champ,.final,.tort-show,.call")) {
      let n = 0; try { n = Number(ls.get("porra_call_" + c.id) || 0); } catch (e) {}
      if (n < 5) { ls.set("porra_call_" + c.id, String(n + 1)); S.callShown = true; showCall(c); return; }
    } }
  { const an = S.data.anuncio; let seenA = []; try { seenA = JSON.parse(ls.get("porra_duels") || "[]"); } catch (e) {}
    if (an && !seenA.includes("an:" + an.id) && !document.querySelector(".duel,.heist,.champ,.final,.sheet-bg")) { seenA.push("an:" + an.id); ls.set("porra_duels", JSON.stringify(seenA.slice(-80))); showAnuncio(an); return; } }
  let seen = [];
  try { seen = JSON.parse(ls.get("porra_duels") || "[]"); } catch (e) {}
  const me = S.data.me.name;
  const fin = (S.data.retos || []).find((r) => r.done && r.winner && (r.winner === me || r.loser === me) && !seen.includes("res:" + r.id));
  if (fin) { seen.push("res:" + fin.id); ls.set("porra_duels", JSON.stringify(seen.slice(-80))); showHeist(fin); return; }
  // gran final: cuando acaba la jornada 38, a todos les sale la entrega del balón de oro (una vez)
  const j38 = (S.data.jornadas || []).find((j) => !j.extra && j.num === 38);
  if (j38 && jDone(j38) && S.data.table.length && !seen.includes("final")) {
    seen.push("final"); ls.set("porra_duels", JSON.stringify(seen.slice(-80))); showFinal(); return;
  }
  // tortilla: las 2 primeras veces que abres la app tras el cierre del mes (hasta el día siguiente al viernes)
  { const T = S.data.tortilla; const nowMs = serverNow();
    const pc = T && T.periods.filter((p) => p.closed && p.losers.length && nowMs < p.friday + 864e5).pop();
    if (pc && !S.tortShown) {
      let cnt = 0; try { cnt = Number(ls.get("porra_tort_" + pc.id) || 0); } catch (e) {}
      if (cnt < 2) { ls.set("porra_tort_" + pc.id, String(cnt + 1)); S.tortShown = true; showTortilla(pc); return; }
    } }
  // campeón de jornada (solo la primera vez que entras tras ganarla)
  const won = (S.data.jornadas || []).filter((j) => !j.extra && (j.winners || []).includes(me) && !seen.includes("win:" + j.id)).pop();
  if (won) { seen.push("win:" + won.id); ls.set("porra_duels", JSON.stringify(seen.slice(-80))); showChamp(won); return; }
  const nuevo = (S.data.retos || []).find((r) => r.to === me && !r.done && !seen.includes(r.id));
  if (!nuevo) return;
  seen.push(nuevo.id); ls.set("porra_duels", JSON.stringify(seen.slice(-80)));
  showDuel(nuevo);
}

/* ---------- Avisos push ---------- */
function b64ToU8(b64) {
  const pad = "=".repeat((4 - (b64.length % 4)) % 4);
  const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(raw, (c) => c.charCodeAt(0));
}
async function enablePush(test) {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      if (isIOS()) installHelp(); else toast("Este navegador no admite avisos", true);
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== "granted") { toast("Has bloqueado los avisos. Actívalos en los ajustes del móvil.", true); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      const { publicKey } = await api("vapid");
      if (!publicKey) { toast("Los avisos aún no están disponibles en el servidor", true); return; }
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
    }
    await api("subscribe", { sub: sub.toJSON() });
    ls.set("porra_push", "1");
    if (test) { const r = await api("testPush"); toast(r.sent ? "¡Avisos activados! Te ha llegado uno de prueba." : "Avisos activados."); }
    else toast("¡Avisos activados!");
  } catch (e) { toast("No se pudieron activar los avisos: " + e.message, true); }
}
function maybeAskPush() {
  if (!S.data || ls.get("porra_push") === "1" || ls.get("porra_push_asked") === "1") return;
  if (!("PushManager" in window) || typeof Notification === "undefined" || Notification.permission !== "default") return;
  ls.set("porra_push_asked", "1");
  openSheet(`<div style="text-align:center"><div style="font-size:46px">🔔</div><h2 class="cond" style="margin:6px 0;font-size:26px">¿Te avisamos?</h2>
    <p class="muted">Si a 1 hora de un partido no has puesto tu resultado, te llega una notificación al móvil.</p></div>
    <button class="btn primary block" id="pushYes">Sí, avisadme</button><button class="btn block" style="margin-top:8px" data-close>Ahora no</button>`,
  (el, close) => { $("#pushYes", el).onclick = () => { close(); enablePush(true); }; $("[data-close]", el).onclick = close; });
}

  // Jornada
  document.querySelectorAll("[data-j]").forEach((b) => (b.onclick = () => { const j = S.data.jornadas[+b.dataset.j]; if (j) { S.jornada = j.id; render(); } }));
  document.querySelectorAll("[data-tp]").forEach((b) => (b.onclick = () => { const x = S.data.tortilla.periods[+b.dataset.tp]; if (x) { S.tortP = x.id; render(); } }));
  document.querySelectorAll("[data-tj]").forEach((b) => (b.onclick = () => {
    const jl = S.data.jornadas;
    const x = jl[+b.dataset.tj]; if (x) { S.tablaJ = x.id; render(); }
  }));
  document.querySelectorAll("[data-others]").forEach((b) => (b.onclick = () => { S.openOthers[b.dataset.others] = !S.openOthers[b.dataset.others]; render(); }));
  const j = S.data.jornadas.length ? curJ() : null;
  const dr = j ? (S.drafts[j.id] = S.drafts[j.id] || {}) : null;
  const getDraft = (mid) => {
    if (!dr[mid]) { const m = j.matches.find((x) => x.id === mid); dr[mid] = m && m.mine ? { h: m.mine.h, a: m.mine.a, x2: !!m.mine.x2 } : { h: "", a: "", x2: false }; }
    return dr[mid];
  };
  document.querySelectorAll(".gbox input").forEach((inp) => (inp.oninput = () => {
    let v = inp.value.replace(/\D/g, "").slice(0, 2);
    if (v !== "" && +v > 30) v = "30";
    inp.value = v; getDraft(inp.dataset.m)[inp.dataset.side] = v === "" ? "" : +v;
  }));
  document.querySelectorAll("[data-step]").forEach((b) => (b.onclick = () => {
    const d = getDraft(b.dataset.m), s = b.dataset.side;
    const v = Math.max(0, Math.min(30, (d[s] === "" ? (b.dataset.step > 0 ? -1 : 1) : d[s]) + +b.dataset.step));
    d[s] = v; const inp = document.querySelector(`.gbox input[data-m="${b.dataset.m}"][data-side="${s}"]`); if (inp) inp.value = v;
    if (navigator.vibrate) navigator.vibrate(8);
  }));
  document.querySelectorAll("[data-x2]").forEach((b) => (b.onclick = () => {
    const d = getDraft(b.dataset.x2);
    if (!d.x2) {
      // uno por jornada: si ya hay otro activado en esta jornada, se mueve aquí
      for (const m of j.matches) {
        if (m.id === b.dataset.x2 || liveStatus(m) !== "open") continue;
        const o = getDraft(m.id);
        if (o.x2) { o.x2 = false; toast("Comodín movido a este partido (solo 1 por jornada)"); }
      }
      const lockedX2 = j.matches.some((m) => m.id !== b.dataset.x2 && liveStatus(m) !== "open" && m.mine && m.mine.x2);
      if (lockedX2) { toast("Ya usaste el comodín en otro partido de esta jornada", true); return; }
      const c = S.data.me.comodines || { total: 3, used: 0 };
      const used = c.used + j.matches.reduce((n, m) => { const x = dr[m.id]; if (!x || liveStatus(m) !== "open") return n; return n + (x.x2 ? 1 : 0) - (m.mine && m.mine.x2 ? 1 : 0); }, 0);
      if (used >= c.total) { toast(`Ya has usado tus ${c.total} comodines de la temporada`, true); return; }
    }
    d.x2 = !d.x2; render();
    if (navigator.vibrate) navigator.vibrate(15);
  }));
  const rg = $("#retoGo");
  if (rg) rg.onclick = async () => {
    const to = $("#retoTo").value;
    if (!confirm(`¿Retar a ${to} en la jornada ${j.num}?\n\nUna vez lanzado NO se puede cancelar y te quedará un reto menos.`)) return;
    rg.disabled = true;
    try { setData(await api("reto", { jornada: j.id, to })); render(); toast(`⚔️ Has retado a ${to}`); } catch (err) { toast(err.message, true); rg.disabled = false; }
  };
  const rc = $("#retoCancel");
  if (rc) rc.onclick = async () => {
    try { setData(await api("cancelReto", { jornada: j.id })); render(); toast("Reto quitado"); } catch (err) { toast(err.message, true); }
  };
  const sb = $("#saveBtn");
  if (sb) sb.onclick = async () => {
    const picks = {};
    for (const m of j.matches) {
      if (liveStatus(m) !== "open") continue;
      const d = dr[m.id];
      if (!d) continue;
      if ((d.h === "") !== (d.a === "")) { toast(`Completa los dos marcadores de ${m.home} – ${m.away}`, true); return; }
      if (d.h !== "") picks[m.id] = { h: d.h, a: d.a, x2: !!d.x2 };
      else if (d.x2) { toast(`Pon el resultado de ${m.home} – ${m.away} para usar el comodín`, true); return; }
    }
    if (!Object.keys(picks).length) { toast("Pon al menos un resultado", true); return; }
    sb.disabled = true; sb.textContent = "Guardando…";
    try {
      const r = await api("predict", { jornada: j.id, picks });
      S.drafts[j.id] = {}; setData(r); render();
      toast(r.skipped ? `Guardados ${r.saved}. ${r.skipped} ya estaban cerrados.` : `✅ ¡Pronósticos guardados! (${r.saved})`, !!r.skipped && !r.saved);
      if (!r.skipped) setTimeout(maybeAskPush, 900);
    } catch (e) { toast(e.message, true); sb.disabled = false; sb.textContent = "Guardar pronósticos"; }
  };

  // Admin
  const nj = $("#newJ");
  if (nj) nj.onclick = () => {
    const nums = S.data.jornadas.map((x) => x.num);
    S.editJ = { id: null, num: nums.length ? Math.max(...nums.filter((n) => n < 1000), 0) + 1 : 1, title: "", matches: [] };
    render(); window.scrollTo(0, 0);
  };
  const nx = $("#newX");
  if (nx) nx.onclick = () => { S.editJ = { id: null, extra: true, num: 0, title: "", matches: [{ home: "", away: "", kickoff: "" }] }; render(); window.scrollTo(0, 0); };
  document.querySelectorAll("[data-editj]").forEach((b) => (b.onclick = () => {
    const x = S.data.jornadas.find((q) => q.id === b.dataset.editj);
    S.editJ = { id: x.id, extra: !!x.extra, num: x.num, title: x.title, matches: x.matches.map((m) => ({ id: m.id, home: m.home, away: m.away, kickoff: m.kickoff, result: m.result })) };
    render(); window.scrollTo(0, 0);
  }));
  document.querySelectorAll("[data-addm]").forEach((b) => (b.onclick = () => {
    collectEdit(); S.editJ.matches.push({ home: b.dataset.addm, away: "", kickoff: "" }); render();
    const rows = document.querySelectorAll("#ejMatches .mrow"); const last = rows[rows.length - 1];
    if (last) last.querySelector(b.dataset.addm ? '[data-f="away"]' : '[data-f="home"]').focus();
  }));
  document.querySelectorAll("[data-delm]").forEach((b) => (b.onclick = () => { collectEdit(); S.editJ.matches.splice(+b.dataset.delm, 1); render(); }));
  document.querySelectorAll("[data-swap]").forEach((b) => (b.onclick = () => { collectEdit(); const m = S.editJ.matches[+b.dataset.swap]; [m.home, m.away] = [m.away, m.home]; render(); }));
  // Invitación
  if ($("#leagueCode")) {
    const loadCode = async (regen) => { try { const r = await api("code", { regen }); S.leagueCode = r.code; const el = $("#leagueCode"); if (el) el.textContent = r.code; } catch (err) { toast(err.message, true); } };
    if (!S.leagueCode) loadCode(false);
    $("#invShare").onclick = async () => {
      if (!S.leagueCode) await loadCode(false);
      const text = inviteText(S.leagueCode);
      if (navigator.share) { try { await navigator.share({ title: "La Porra", text }); return; } catch (e) { if (e.name === "AbortError") return; } }
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    };
    $("#invCopy").onclick = async () => {
      if (!S.leagueCode) await loadCode(false);
      try { await navigator.clipboard.writeText(inviteText(S.leagueCode)); toast("Mensaje copiado. Pégalo en WhatsApp"); }
      catch (e) { prompt("Copia este mensaje:", inviteText(S.leagueCode)); }
    };
    $("#invRegen").onclick = async () => {
      const c = prompt("Nuevo código de la liga (4-12 letras o números). Déjalo vacío para generar uno al azar. El anterior dejará de servir para nuevas altas:", S.leagueCode || "");
      if (c === null) return;
      try { const r = await api("code", c.trim() ? { custom: c.trim() } : { regen: true }); S.leagueCode = r.code; const el = $("#leagueCode"); if (el) el.textContent = r.code; toast("Código de la liga: " + r.code); }
      catch (err) { toast(err.message, true); }
    };
  }
  const as = $("#anSend");
  if (as) as.onclick = async () => {
    const title = $("#anTitle").value.trim(), body = $("#anBody").value.trim();
    if (!body) { toast("Escribe el mensaje antes de enviarlo", true); $("#anBody").focus(); return; }
    if (!confirm("¿Enviar este aviso a todos los participantes?")) return;
    as.disabled = true;
    try { const r = await api("broadcast", { title, body }); setData(r); render(); toast(`Aviso enviado (${r.sent} notificaciones al móvil)`); } catch (err) { toast(err.message, true); as.disabled = false; }
  };
  const ac = $("#anClear"); if (ac) ac.onclick = async () => { try { setData(await api("clearAnuncio")); render(); } catch (err) { toast(err.message, true); } };
  document.querySelectorAll("[data-gift]").forEach((b) => (b.onclick = async () => {
    const n = b.dataset.gift;
    if (!confirm(`¿Regalar un comodín x2 extra a ${n}?`)) return;
    try { setData(await api("giveX2", { name: n, n: 1 })); render(); toast(`🎁 Comodín regalado a ${n}`); } catch (err) { toast(err.message, true); }
  }));
  const cs = $("#callSend");
  if (cs) cs.onclick = async () => {
    const text = $("#callText").value.trim();
    if (!text) { toast("Escribe lo que dirá la llamada", true); return; }
    if (!confirm("¿Llamar a todos los participantes con este mensaje?")) return;
    try { setData(await api("llamar", { text })); render(); toast("📞 Llamando a todos…"); } catch (err) { toast(err.message, true); }
  };
  const rr = $("#resetRetos");
  if (rr) rr.onclick = async () => {
    if (!confirm("¿Reiniciar TODOS los retos? Se borran los lanzados y los resultados, y la clasificación se recalcula. No se puede deshacer.")) return;
    try { setData(await api("resetRetos")); render(); toast("Retos reiniciados"); } catch (err) { toast(err.message, true); }
  };
  const sc = $("#syncCal");
  if (sc) sc.onclick = async () => {
    sc.disabled = true;
    try { setData(await api("syncCalendar")); render(); toast("Calendario actualizado"); } catch (err) { toast(err.message, true); sc.disabled = false; }
  };
  const ec = $("#ejCancel"); if (ec) ec.onclick = () => { S.editJ = null; render(); };
  const es = $("#ejSave");
  if (es) es.onclick = async () => {
    collectEdit(); es.disabled = true;
    try {
      const e = S.editJ;
      setData(await api("saveJornada", { id: e.id, extra: !!e.extra, num: +e.num, title: e.title, matches: e.matches }));
      S.editJ = null; render(); toast("Jornada guardada");
    } catch (err) { toast(err.message, true); es.disabled = false; }
  };
  const ed = $("#ejDel");
  if (ed) ed.onclick = async () => {
    if (!confirm("¿Borrar esta jornada y sus pronósticos? No se puede deshacer.")) return;
    try { setData(await api("deleteJornada", { id: S.editJ.id })); S.editJ = null; S.jornada = null; setData(S.data); render(); toast("Jornada borrada"); }
    catch (err) { toast(err.message, true); }
  };
  document.querySelectorAll("[data-anul]").forEach((b) => (b.onclick = async () => {
    const [jid, mid, v] = b.dataset.anul.split("|");
    if (v === "1" && !confirm("¿Marcar este partido como aplazado? Quedará ANULADO y no contará para nadie.")) return;
    try { setData(await api("setCancelled", { jornada: jid, match: mid, cancelled: v === "1" })); render(); toast(v === "1" ? "Partido anulado" : "Partido reactivado"); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-res]").forEach((b) => (b.onclick = async () => {
    const [jid, mid] = b.dataset.res.split("|");
    const h = $("#rh-" + mid).value, a = $("#ra-" + mid).value;
    try {
      if (h === "" && a === "") setData(await api("setResult", { jornada: jid, match: mid, clear: true }));
      else setData(await api("setResult", { jornada: jid, match: mid, h: +h, a: +a }));
      render(); toast("Resultado guardado · clasificación actualizada");
    } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-uadm]").forEach((b) => (b.onclick = async () => {
    const [n, v] = b.dataset.uadm.split("|");
    try { setData(await api("setAdmin", { name: n, admin: v === "1" })); render(); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-upin]").forEach((b) => (b.onclick = async () => {
    const pass = prompt(`Nueva contraseña para ${b.dataset.upin} (mínimo 6). Pásasela y que la cambie desde su perfil:`);
    if (!pass) return;
    try { await api("resetPass", { name: b.dataset.upin, pass }); toast(`Contraseña de ${b.dataset.upin} cambiada a: ${pass}`); } catch (err) { toast(err.message, true); }
  }));
  document.querySelectorAll("[data-udel]").forEach((b) => (b.onclick = async () => {
    if (!confirm(`¿Eliminar a ${b.dataset.udel} y todos sus pronósticos?`)) return;
    try { setData(await api("deleteUser", { name: b.dataset.udel })); render(); toast("Jugador eliminado"); } catch (err) { toast(err.message, true); }
  }));
}

/* ---------- Halloween: hasta el lunes 2/11/2026 a las 22:00 (Madrid) ---------- */
const HALLOWEEN_END = Date.parse("2026-11-02T22:00:00+01:00");
function halloween() {
  let force = false; try { force = new URLSearchParams(location.search).has("halloween"); } catch (e) {}
  if (!force && Date.now() > HALLOWEEN_END) return;
  if (document.getElementById("hw")) return;
  const web = `<svg viewBox="0 0 120 120" fill="none" stroke="#fff" stroke-width="1.1">
    ${[0, 18, 36, 54, 72, 90].map((a) => { const r = a * Math.PI / 180; return `<line x1="0" y1="0" x2="${(130 * Math.cos(r)).toFixed(1)}" y2="${(130 * Math.sin(r)).toFixed(1)}"/>`; }).join("")}
    ${[22, 44, 68, 94].map((R) => `<path d="${[0, 18, 36, 54, 72, 90].map((a, i) => { const r = a * Math.PI / 180, x = (R * Math.cos(r)).toFixed(1), y = (R * Math.sin(r)).toFixed(1); return (i ? "Q" + (R * 0.82 * Math.cos(r - 0.157)).toFixed(1) + " " + (R * 0.82 * Math.sin(r - 0.157)).toFixed(1) + " " : "M") + x + " " + y; }).join(" ")}"/>`).join("")}</svg>`;
  const spider = `<svg viewBox="-20 -20 40 40"><g stroke="#111" stroke-width="2.2" stroke-linecap="round" fill="none">
    <g class="lg1">${[[-4, -3, -16, -12], [-5, 0, -18, -2], [4, 3, 16, 12], [5, 0, 18, 2]].map(([a, b, c, d]) => `<path d="M${a} ${b} Q${(a + c) / 2} ${(b + d) / 2 - 6} ${c} ${d}"/>`).join("")}</g>
    <g class="lg2">${[[-5, 2, -17, 9], [-4, 4, -13, 16], [5, -2, 17, -9], [4, -4, 13, -16]].map(([a, b, c, d]) => `<path d="M${a} ${b} Q${(a + c) / 2} ${(b + d) / 2 - 6} ${c} ${d}"/>`).join("")}</g></g>
    <ellipse cx="0" cy="3" rx="6.5" ry="8" fill="#141414"/><circle cx="0" cy="-6" r="4.2" fill="#1d1d1d"/>
    <circle cx="-1.5" cy="-7.5" r="1.1" fill="#ff3b3b"/><circle cx="1.5" cy="-7.5" r="1.1" fill="#ff3b3b"/></svg>`;
  const pumpkin = `<svg viewBox="0 0 60 60"><path d="M30 12 C32 6 36 4 38 5" stroke="#3d6b1f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="18" cy="35" rx="13" ry="18" fill="#e8730c"/><ellipse cx="42" cy="35" rx="13" ry="18" fill="#e8730c"/><ellipse cx="30" cy="35" rx="14" ry="20" fill="#f58a1f"/>
    <g class="eye" fill="#ffe14d"><path d="M19 30 l6 -6 l4 7z"/><path d="M41 30 l-6 -6 l-4 7z"/><path d="M17 40 q13 10 26 0 l-4 3 -3 -3 -3 4 -3 -4 -3 4 -3 -4 -3 3z"/></g></svg>`;
  const ghost = `<svg viewBox="0 0 52 62"><g class="gb"><path d="M26 2 C12 2 4 13 4 27 L4 58 L11 52 L18 58 L26 52 L34 58 L41 52 L48 58 L48 27 C48 13 40 2 26 2Z" fill="rgba(255,255,255,.88)"/>
    <ellipse cx="19" cy="25" rx="3.5" ry="5" fill="#1a1a2a"/><ellipse cx="33" cy="25" rx="3.5" ry="5" fill="#1a1a2a"/><ellipse cx="26" cy="37" rx="4" ry="3" fill="#1a1a2a"/></g></svg>`;
  const hw = document.createElement("div");
  hw.id = "hw"; hw.setAttribute("aria-hidden", "true");
  hw.innerHTML = `<div class="web tl">${web}</div><div class="web tr">${web}</div><div class="web br">${web}</div><div class="web bl">${web}</div>
    <div class="hang"><i></i>${spider}</div>
    <div class="spider walk">${spider}</div>
    <div class="pk" style="left:10px;bottom:calc(76px + var(--safe-b))">${pumpkin}</div>
    <div class="pk" style="right:4px;top:calc(66px + var(--safe-t));width:38px;height:38px">${pumpkin}</div>
    <div class="pk" style="right:14px;bottom:calc(150px + var(--safe-b))">${pumpkin}</div>
    <div class="ghost">${ghost}</div>`;
  document.body.appendChild(hw);
  // araña paseando por toda la pantalla: camina a un punto, se para, sigue
  const sp = hw.querySelector(".spider");
  let x = innerWidth * 0.3, y = innerHeight * 0.5, tx = x, ty = y, ang = 0, pause = 0;
  const pick = () => { tx = 20 + Math.random() * (innerWidth - 50); ty = 80 + Math.random() * (innerHeight - 180); };
  pick();
  const step = () => {
    if (!hw.isConnected) return;
    if (!force && Date.now() > HALLOWEEN_END) { hw.remove(); return; }
    if (pause > 0) { pause--; sp.classList.remove("walk"); }
    else {
      sp.classList.add("walk");
      const dx = tx - x, dy = ty - y, d = Math.hypot(dx, dy);
      if (d < 3) { pause = 40 + Math.random() * 140; pick(); }
      else { const v = 1.1; x += dx / d * v; y += dy / d * v; const target = Math.atan2(dy, dx) * 180 / Math.PI + 90; ang += ((target - ang + 540) % 360 - 180) * 0.12; }
    }
    sp.style.transform = `translate(${x - 19}px,${y - 19}px) rotate(${ang}deg)`;
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  // calabazas que aparecen y desaparecen por turnos
  const pks = [...hw.querySelectorAll(".pk")]; let k = 0;
  const cyclePk = () => { if (!hw.isConnected) return; pks.forEach((p, i) => p.classList.toggle("on", i === k % pks.length || i === (k + 1) % pks.length && Math.random() < .3)); k++; setTimeout(cyclePk, 3200 + Math.random() * 1800); };
  setTimeout(cyclePk, 600);
  // fantasma que cruza de vez en cuando
  const gh = hw.querySelector(".ghost");
  const boo = () => {
    if (!hw.isConnected) return;
    const ltr = Math.random() < .5; gh.style.top = (120 + Math.random() * (innerHeight * .45)) + "px"; gh.style.left = "0px";
    gh.style.setProperty("--x0", (ltr ? -60 : innerWidth + 10) + "px"); gh.style.setProperty("--x1", (ltr ? innerWidth + 10 : -60) + "px");
    gh.querySelector("svg").style.transform = ltr ? "" : "scaleX(-1)";
    gh.classList.remove("fly"); void gh.offsetWidth; gh.classList.add("fly");
    setTimeout(boo, 14000 + Math.random() * 12000);
  };
  setTimeout(boo, 2500);
}
halloween();

/* ---------- Arranque ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== S.tab) { S.tab = t; render(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(true); });
// Cada 30 s: refresca contadores; si un partido acaba de cerrar o empezar, vuelve a pedir datos
let lastSig = "";
setInterval(() => {
  if (!S.data || S.tab !== "jornada" || S.editJ) return;
  const j = curJ(); if (!j) return;
  const sig = j.matches.map(liveStatus).join();
  if (lastSig && sig !== lastSig) refresh(true);
  else if (!document.activeElement || !document.activeElement.matches("input")) render();
  lastSig = sig;
}, 30000);
setInterval(() => { if (!document.hidden && S.token) refresh(true); }, 5 * 60000);
refresh();
</script>
