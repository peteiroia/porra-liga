# Cada 10 minutos le pide a la web que envíe los avisos de "te falta un pronóstico".
# Pon la dirección de tu web en Settings → Secrets and variables → Actions → Variables → SITE_URL
name: Avisos de pronósticos
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enviar avisos
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://la-porra.vercel.app' }}
        run: curl -fsS "$SITE_URL/api/porra?cron=1" || true
